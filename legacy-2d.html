    for (const e of lv.enemies || []) {
      if (e && !e.dead && e.kind !== 'boss' && !(e.hp <= 0)) out.push({ type: 'enemy', x: e.x, y: e.y });
    }
    const b = lv.boss;
    if (b && !b.dead && !(b.hp <= 0)) out.push({ type: 'boss', x: b.x, y: b.y });
    for (const c of lv.chests || []) if (c && !c.opened) out.push({ type: 'chest', x: c.x, y: c.y });
    return out;
  };

  // Layout of the world inside a square map of `size`, aspect preserved and centred.
  M.layout = function (game, x, y, size) {
    const ws = worldSize(game);
    const s = size / Math.max(ws.w, ws.h);
    const w = ws.w * s, h = ws.h * s;
    return { ws: ws, scale: s, ox: x + (size - w) / 2, oy: y + (size - h) / 2, w: w, h: h };
  };

// Aether's Trial — procedural Web Audio SFX + soft ambient pad. Owner: visuals.
// Nothing runs at load. init() creates the AudioContext lazily (call from a user gesture).
(function () {
  const AT = globalThis.AT;

  const Audio = {
    ctx: null,
    master: null,
    sfxBus: null,
    padBus: null,
    muted: false,
    volume: 0.55,
    ambientOn: false,
    _pad: null,
    _noiseBuf: null,
    _last: {},
    _bound: false,
    _handlers: [],

    /** Create the AudioContext lazily and resume it. Safe to call repeatedly. */

    setMuted(m) {
      this.muted = !!m;

    },
    toggleMute() { this.setMuted(!this.muted); return this.muted; },

    // ---------- primitives ----------
    _ready() {

        if (!this.ctx) return false;

        return true;
      } catch (e) { return false; }
    },

    _noise() {
      const c = this.ctx;

      const len = c.sampleRate * 1.5;
      const b = c.createBuffer(1, len, c.sampleRate);
      const d = b.getChannelData(0);

      for (let i = 0; i < len; i++) { s = (s * 1664525 + 1013904223) >>> 0; d[i] = (s / 4294967296) * 2 - 1; }

      osc.frequency.setValueAtTime(Math.max(20, freq), t0);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + dur);
      if (o.detune) osc.detune.value = o.detune;

      const a = o.attack == null ? 0.005 : o.attack;

    noise(dur, o) {

      const a = o.attack == null ? 0.004 : o.attack;

        A.tone(420, 0.12, { type: 'triangle', to: 900, vol: 0.06 });

      hit(A) {

        A.tone(190, 0.12, { type: 'square', to: 70, vol: 0.2 });
        A.tone(1100, 0.05, { type: 'triangle', to: 600, vol: 0.08 });
      },
      fire(A) {
        A.noise(0.42, { filter: 'bandpass', freq: 500, to: 2200, q: 0.7, vol: 0.28, attack: 0.04 });
        A.tone(130, 0.35, { type: 'sawtooth', to: 260, vol: 0.09 });
        A.tone(520, 0.2, { type: 'triangle', to: 1040, vol: 0.05, delay: 0.04 });
      },
      vaporize(A) {
        A.noise(0.6, { filter: 'highpass', freq: 3500, to: 1600, q: 0.6, vol: 0.3, attack: 0.02 });
        A.noise(0.4, { filter: 'bandpass', freq: 1200, to: 4200, q: 1.5, vol: 0.14 });
        A.tone(900, 0.4, { type: 'sine', to: 220, vol: 0.1 });
      },
      burst(A) {
        A.noise(0.9, { filter: 'lowpass', freq: 3200, to: 160, q: 0.8, vol: 0.4, attack: 0.02 });
        A.tone(70, 0.8, { type: 'sine', to: 35, vol: 0.45 });
        A.tone(220, 0.7, { type: 'sawtooth', to: 880, vol: 0.1 });
        A.tone(660, 0.5, { type: 'triangle', to: 1320, vol: 0.08, delay: 0.1 });
      },
      dash(A) {
        A.noise(0.22, { filter: 'bandpass', freq: 2600, to: 700, q: 0.8, vol: 0.2 });
        A.tone(300, 0.15, { type: 'sine', to: 120, vol: 0.08 });
      },
      chest(A) {
        const n = [523, 659, 784, 1047, 1319];
        for (let i = 0; i < n.length; i++) A.tone(n[i], 0.35, { type: 'triangle', vol: 0.12, delay: i * 0.07 });
        A.tone(130, 0.2, { type: 'square', to: 80, vol: 0.12 });
      },
      coin(A) {
        A.tone(988, 0.07, { type: 'square', vol: 0.09 });
        A.tone(1319, 0.2, { type: 'square', vol: 0.09, delay: 0.06 });
      },
      levelup(A) {
        const n = [392, 494, 587, 784, 988];
        for (let i = 0; i < n.length; i++) {
          A.tone(n[i], 0.45, { type: 'triangle', vol: 0.15, delay: i * 0.09 });
          A.tone(n[i] * 2, 0.3, { type: 'sine', vol: 0.05, delay: i * 0.09 });
        }
      },
      bossdefeat(A) {
        A.tone(110, 1.2, { type: 'sawtooth', to: 40, vol: 0.25 });
        A.noise(1.0, { filter: 'lowpass', freq: 2200, to: 100, vol: 0.35 });
        const n = [392, 523, 659, 784, 1047];
        for (let i = 0; i < n.length; i++) A.tone(n[i], 0.7, { type: 'triangle', vol: 0.13, delay: 0.5 + i * 0.12 });
      },
      gameover(A) {
        const n = [392, 349, 311, 262];
        for (let i = 0; i < n.length; i++) A.tone(n[i], 0.7, { type: 'triangle', vol: 0.18, delay: i * 0.32, to: n[i] * 0.97 });
        A.tone(65, 1.6, { type: 'sine', vol: 0.3, delay: 0.2 });
      },
      victory(A) {
        const n = [523, 659, 784, 1047, 784, 1047, 1319];
        const d = [0, 0.14, 0.28, 0.42, 0.7, 0.84, 1.0];
        for (let i = 0; i < n.length; i++) {
          A.tone(n[i], 0.6, { type: 'triangle', vol: 0.16, delay: d[i] });
          A.tone(n[i] / 2, 0.6, { type: 'sine', vol: 0.1, delay: d[i] });
        }
      },
      hurt(A) {
        A.tone(240, 0.22, { type: 'sawtooth', to: 90, vol: 0.2 });
        A.noise(0.14, { filter: 'lowpass', freq: 1800, to: 300, vol: 0.2 });
      },
      potion(A) {
        for (let i = 0; i < 3; i++) A.tone(500 + i * 120, 0.12, { type: 'sine', to: 900 + i * 150, vol: 0.12, delay: i * 0.08 });
        A.tone(1400, 0.4, { type: 'sine', vol: 0.06, delay: 0.25 });

        A.tone(180, 0.28, { type: 'sawtooth', to: 360, vol: 0.07, attack: 0.05 });
        A.tone(540, 0.2, { type: 'square', vol: 0.03, delay: 0.1 });

    _gap: { hit: 0.04, coin: 0.05, swing: 0.08, fire: 0.1, vaporize: 0.12, hurt: 0.15, telegraph: 0.2, dash: 0.1 },

    play(name) {

        if (!this._ready()) return false;

        if (!def) return false;

        const gap = this._gap[name] || 0;
        if (gap && this._last[name] != null && now - this._last[name] < gap) return false;

      } catch (e) { return false; }

    // ---------- ambient pad ----------
    startAmbient() {

    stopAmbient() {

    },

    // ---------- event wiring ----------
    bind() {

        swordSwing: () => self.play('swing'),

        reaction: () => self.play('vaporize'),
        skillCast: () => self.play('fire'),
        burstCast: () => self.play('burst'),
        dash: () => self.play('dash'),
        chestOpened: () => self.play('chest'),
        pickup: (p) => self.play(p && p.kind === 'potion' ? 'potion' : 'coin'),
        levelUp: () => self.play('levelup'),
        bossDefeated: () => self.play('bossdefeat'),
        playerDied: () => self.play('gameover'),
        victory: () => self.play('victory'),
        playerHurt: () => self.play('hurt'),
        potionUsed: () => self.play('potion'),
        telegraph: () => self.play('telegraph')

    unbind() {
      const ev = AT.events; if (ev) this._handlers.forEach(h => ev.off(h[0], h[1]));

    }
  };

  AT.Audio = Audio;
})();

    electro: ['#f2e0ff', '#b98cff', '#7a44d8'], anemo: ['#eafff6', '#7dffd0', '#2fbf98'],
    cryo: ['#ffffff', '#bfeeff', '#6fc4ea'], geo: ['#fff0b8', '#f0b840', '#a8741a'],
    physical: ['#ffffff', '#dfe9ff', '#9db4e8'], none: ['#ffffff', '#dfe9ff', '#9db4e8']

  function cap() { return (AT.CFG && AT.CFG.LIMITS && AT.CFG.LIMITS.particles) || 600; }

  const P = {
    list: [],
    _pool: [],
    _bound: false,
    _handlers: [],
    _ambT: 0,
    _ambPetals: 0,
    _ambWind: 0,
    _selfUpdated: false,
    _lastClock: 0,
    ELCOL,

    count() { return this.list.length; },
    clear() { for (let i = 0; i < this.list.length; i++) this._pool.push(this.list[i]); this.list.length = 0; this._ambPetals = 0; this._ambWind = 0; },

    /**
     * def: {kind, x, y, vx, vy, life, size, size1, color, color2, alpha, g, drag, rot, vr, add, grow, text, amb}
     * Returns the particle, or null when the hard cap is reached.

    spawn(def) {
      if (this.list.length >= cap()) return null;

      p.kind = def.kind || 'glow';
      p.x = def.x || 0; p.y = def.y || 0;
      p.vx = def.vx || 0; p.vy = def.vy || 0;
      p.life = p.max = def.life > 0 ? def.life : 0.5;

      p.size1 = def.size1 == null ? p.size : def.size1;

      p.color2 = def.color2 || null;
      p.alpha = def.alpha == null ? 1 : def.alpha;
      p.g = def.g || 0;
      p.drag = def.drag || 0;
      p.rot = def.rot || 0;
      p.vr = def.vr || 0;

    /** High level bursts. kind: fire|steam|spark|glow|petal|wind|ring|puff|gold */
    burst(kind, x, y, o) {
      o = o || {};
      const n = o.count == null ? 8 : o.count;
      const el = ELCOL[o.element] || ELCOL.physical;
      const dirA = o.angle == null ? 0 : o.angle, spread = o.spread == null ? TAU : o.spread;
      const speed = o.speed == null ? 100 : o.speed;
      for (let i = 0; i < n; i++) {
        const a = dirA + (Math.random() - 0.5) * spread;
        const s = speed * rnd(0.4, 1.1);
        const ca = Math.cos(a), sa = Math.sin(a);
        let ok = true;
        switch (kind) {
          case 'fire':
            ok = this.spawn({ kind: 'fire', x: x + rnd(-4, 4), y: y + rnd(-4, 4), vx: ca * s, vy: sa * s - 20, life: rnd(0.35, 0.7),
              size: rnd(5, 9), size1: 1, color: '#ffd27a', color2: '#e0391a', add: true, drag: 2.2, g: -40 });
            break;
          case 'steam':
            ok = this.spawn({ kind: 'steam', x: x + rnd(-10, 10), y: y + rnd(-8, 8), vx: ca * s * 0.45, vy: sa * s * 0.35 - 30, life: rnd(0.8, 1.4),
              size: rnd(10, 16), size1: rnd(34, 52), color: i % 3 ? '#ffffff' : '#bfe6ff', alpha: 0.7, drag: 1.2, g: -22, rot: rnd(0, TAU), vr: rnd(-1, 1) });
            break;
          case 'puff':
            ok = this.spawn({ kind: 'steam', x: x + rnd(-6, 6), y: y + rnd(-6, 6), vx: ca * s, vy: sa * s, life: rnd(0.35, 0.65),
              size: rnd(6, 10), size1: rnd(16, 26), color: o.color || el[0], alpha: 0.6, drag: 3 });
            break;
          case 'spark':
            ok = this.spawn({ kind: 'spark', x, y, vx: ca * s * 1.6, vy: sa * s * 1.6, life: rnd(0.15, 0.4), size: rnd(1.4, 2.4), size1: 0.4,
              color: o.color || el[0], color2: el[1], add: true, drag: 2.5, g: o.g == null ? 120 : o.g, len: rnd(5, 11) });
            break;
          case 'glow':
            ok = this.spawn({ kind: 'glow', x: x + rnd(-6, 6), y: y + rnd(-6, 6), vx: ca * s * 0.5, vy: sa * s * 0.5 - 18, life: rnd(0.5, 1.1),
              size: rnd(5, 10), size1: 1, color: o.color || el[1], add: true, drag: 1.4 });
            break;
          case 'gold':
            ok = this.spawn({ kind: 'spark', x, y, vx: ca * s, vy: sa * s - 50, life: rnd(0.5, 0.9), size: rnd(2, 3.4), size1: 0.6,
              color: '#fff2b0', color2: '#f0b840', add: true, g: 160, drag: 1.2, len: 5 });
            break;
          case 'ring':
            ok = this.spawn({ kind: 'ring', x, y, life: o.life || 0.5, size: o.size || 8, size1: o.size1 || 90, color: o.color || el[1], add: true, alpha: 0.9 });
            i = n; // one ring per call
            break;
          case 'petal':
            ok = this.spawn({ kind: 'petal', x, y, vx: rnd(10, 40), vy: rnd(10, 30), life: rnd(6, 11), size: rnd(2.5, 4), color: i % 2 ? '#ffd1e6' : '#fff4f8',

              color: '#dfefff', alpha: 0.5, amb: o.amb || 0 });
            break;
          default:

    /** Ambient petals (fields) / wind streaks (ruins) around the camera view. Soft-capped well below the hard cap. */

    },

    // ---------- events ----------
    bind() {

        if (el === 'pyro') self.burst('fire', p.x, p.y, { count: p.heavy ? 8 : 4, speed: 60 });

      });

        if (!p) return;

        self.burst('ring', p.x, p.y, { color: '#ffffff', size: 10, size1: 70, life: 0.45 });
        self.burst('spark', p.x, p.y, { count: 8, speed: 120, color: '#fff3d0', element: 'pyro' });
      });

        if (!p) return;
        const a = p.angle || 0, x = p.x + Math.cos(a) * 24, y = p.y + Math.sin(a) * 24;
        self.burst('fire', x, y, { count: 18, speed: 210, angle: a, spread: 0.9 });
        self.burst('spark', x, y, { count: 8, speed: 180, angle: a, spread: 1.0, element: 'pyro' });
      });
      on('burstCast', (p) => {
        if (!p) return;
        self.burst('ring', p.x, p.y, { color: '#ffb060', size: 10, size1: (AT.CFG.BURST && AT.CFG.BURST.radius) || 175, life: 0.55 });
        self.burst('fire', p.x, p.y, { count: 46, speed: 300 });
        self.burst('spark', p.x, p.y, { count: 22, speed: 280, element: 'pyro' });
        self.burst('glow', p.x, p.y, { count: 8, speed: 140, element: 'pyro' });
      });

        if (!p) return;
        const a = p.angle || 0;
        self.burst('wind', p.x - Math.cos(a) * 30, p.y - Math.sin(a) * 10, { count: 3 });
        self.burst('puff', p.x, p.y + 8, { count: 5, speed: 60, color: '#e8f2ff', angle: a + Math.PI, spread: 1.2 });

        if (!p) return;

        self.burst('glow', p.x, p.y, { count: 6, speed: 90, element: el });
        self.burst('spark', p.x, p.y, { count: 6, speed: 120, element: el });

        const b = p && p.boss; if (!b) return;

        self.burst('glow', b.x, b.y, { count: 30, speed: 220, color: '#fff2b0' });
        self.burst('gold', b.x, b.y, { count: 30, speed: 220 });
      });
      on('chestOpened', (p) => {
        if (!p) return;
        self.burst('gold', p.x, p.y - 8, { count: 22, speed: 170 });
        self.burst('glow', p.x, p.y - 8, { count: 8, speed: 70, color: '#ffe38a' });
        self.burst('ring', p.x, p.y, { color: '#ffe38a', size: 6, size1: 60, life: 0.5 });
      });
      on('pickup', (p) => {
        if (!p) return;
        const c = p.kind === 'gem' ? '#8ff0ff' : p.kind === 'potion' ? '#ff8aa0' : '#ffe38a';
        self.burst('glow', p.x, p.y, { count: 5, speed: 60, color: c });
      });

        const pl = AT.player; if (!pl) return;
        self.burst('ring', pl.x, pl.y, { color: '#fff0a0', size: 8, size1: 100, life: 0.7 });
        self.burst('glow', pl.x, pl.y, { count: 20, speed: 110, color: '#fff0a0' });
      });

        if (!p) return;
        self.burst('spark', p.x, p.y, { count: 8, speed: 130, color: '#ff8a8a' });
      });
    },

    unbind() {
      const ev = AT.events; if (ev) this._handlers.forEach(h => ev.off(h[0], h[1]));

    pyro: { main: '#ff6a3a', light: '#ffc58a', dark: '#b2271c', glow: '#ffa050' },
    electro: { main: '#b072ff', light: '#e6ccff', dark: '#6633b8', glow: '#d2a8ff' },
    anemo: { main: '#4fe0b0', light: '#c8ffec', dark: '#1d9478', glow: '#8affd8' },
    cryo: { main: '#a4e6ff', light: '#f0fcff', dark: '#4a9ec8', glow: '#d0f4ff' },

  // ---------- HERO ----------
  const HAIR = '#3b82ff', HAIR_D = '#1f4fc4', HAIR_L = '#9fdcff', HAIR_TIP = '#ffd56a';
  const SKIN = '#ffe0c8', SKIN_D = '#f0b898';
  const CAPE = '#d9344a', CAPE_D = '#9c2038', GOLD = '#f2c35a', GOLD_D = '#b88628';
  const TUNIC = '#f6eedb', TUNIC_D = '#d4c49c', BLUE = '#2a62cc', BLUE_D = '#1a3d92';
  const SPIKES = [[-2.95, 14, 0.30], [-2.55, 18, 0.30], [-2.1, 16, 0.28], [-1.62, 21, 0.30], [-1.1, 17, 0.28], [-0.65, 19, 0.30], [-0.22, 14, 0.30]];

  function drawBlade(ctx, ang, o) {
    // Blade drawn from a grip point along local direction ang (already in mirrored local space).

    line(ctx, x0 + px * 4.2, y0 + py * 3.4, x0 - px * 4.2, y0 - py * 3.4, GOLD, 2.4);
    // blade
    line(ctx, x0, y0, x1, y1, OUT, 5.6);
    line(ctx, x0, y0, x1, y1, o.blade || '#bfefff', 3.6);
    line(ctx, x0, y0, x1 - ca * 1.5, y1 - sa * 1.5, '#ffffff', 1.4);
    return [x1, y1];
  }

  /**
   * Core hero renderer.
   * o: {x,y,face,vx,vy,run,phase,bob,swingAng,swingP,lean,lie,eyes,t,flash,ghost,alpha,scale,act,glow,hurt}
   */

    const t = o.t || 0;
    const fa = o.face || 0, ca = Math.cos(fa), sa = Math.sin(fa);

    const swing = o.swingAng != null;

    // --- cape (behind unless facing away) ---

      const tailX = clamp(-vxl * 0.075, -15, 15) + Math.sin(t * 7 + ph) * (1.2 + run * 2.2);
      const tailY = clamp(-vyl * 0.03, -7, 7);

        const u = i / 4;

    // sword behind body when swinging upward
    const hx = 7.5, hy = -22; // sword grip pivot
    const bladeOpt = { gx: hx, gy: hy, len: o.act === 'burst' ? 28 : 24, glow: o.glow == null ? 0.55 : o.glow, glowColor: o.act === 'skill' || o.act === 'burst' ? '#ffa860' : '#7fe4ff', blade: o.act === 'skill' || o.act === 'burst' ? '#ffe2b8' : '#bfefff' };

    // --- legs ---

      ell(ctx, fx + 0.8, fy + 0.6, 3.6, 2.5, '#7a4b2a', OUT, 1.3);
      ell(ctx, fx + 0.8, fy - 0.6, 3.6, 1.1, GOLD, null);

    // --- off arm (behind torso) ---

    ell(ctx, -9.8, -17.4 + armSw * 0.4, 2.2, 2.2, SKIN, OUT, 1.1);

    // --- torso ---
    ctx.beginPath(); ctx.moveTo(-7.4, -29); ctx.lineTo(7.4, -29); ctx.quadraticCurveTo(8.6, -21, 7, -13); ctx.lineTo(-7, -13); ctx.quadraticCurveTo(-8.6, -21, -7.4, -29); ctx.closePath();

    ctx.save(); ctx.clip(); ctx.fillStyle = C(TUNIC_D); ctx.fillRect(1.6, -30, 10, 20); ctx.fillStyle = C(BLUE); ctx.fillRect(-9, -29, 18, 3.4); ctx.restore();

    ctx.fillStyle = C(GOLD); ctx.fillRect(-7.2, -17, 14.4, 3); ctx.strokeStyle = C(OUT); ctx.lineWidth = 1; ctx.strokeRect(-7.2, -17, 14.4, 3);

    // short skirt flaps
    poly(ctx, [[-7.2, -14], [7.2, -14], [8.2, -10.4], [3, -11.6], [0, -9.6], [-3, -11.6], [-8.2, -10.4]], BLUE, OUT, 1.2);

    ctx.strokeStyle = C(HAIR_L); ctx.lineWidth = 1.7; ctx.stroke();

      ctx.fillStyle = C(HAIR_D); ctx.beginPath(); ctx.ellipse(hxo + 4, hcy + 5, 9, 8, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = C(HAIR_L); ctx.beginPath(); ctx.ellipse(hxo - 3.5, hcy - 5, 4.2, 2, -0.5, 0, TAU); ctx.fill(); ctx.restore();
      poly(ctx, [[hxo - 5, hcy + 8], [hxo - 2, hcy + 14], [hxo, hcy + 8], [hxo + 3, hcy + 15], [hxo + 5, hcy + 8]], HAIR, OUT, 1.2);

        ctx.restore();

      ctx.beginPath(); ctx.moveTo(hxo - 10.8, fy + 1.5); ctx.bezierCurveTo(hxo - 11, fy - 12, hxo + 11, fy - 12, hxo + 10.8, fy + 1.5);

  const Sprites = {
    ELEM, elem, drawElementGlyph, mixHex,

    /** Free-form hero pose (used by the cinematic). */
    drawHeroPose(ctx, x, y, o) { o = o || {}; o.x = x; o.y = y; return drawHero(ctx, o); },

    drawPlayer(ctx, p, t, opts) {

      const o = { x: p.x, y: p.y, face: p.facing || 0, vx: p.vx || 0, vy: p.vy || 0, t: t || 0, ghost: !!opts.ghost, alpha: opts.alpha == null ? 1 : opts.alpha, act: anim };

      for (let i = 0; i < L.length; i++) {
        const f = L[i]; f.age += dt;
        if (f.age >= f.life) continue;

    },
    _bind() { if (!this._bound) this.bind(); if (AT.Particles && AT.Particles.bind && !AT.Particles._bound) AT.Particles.bind(); },

    _bg(world) {
      const theme = world.theme === 'ruins' ? 'ruins' : 'fields';
      const key = (world.index || 0) + ':' + theme + ':' + world.w + 'x' + world.h;
      let e = this._cache[key];
      if (e === undefined) {
        e = theme === 'ruins' ? buildRuins(world, 48) : buildFields(world, 48);
        if (e) {
          // convert world.decor into small / big lists once
          e.small = []; e.big = [];
          const dc = world.decor || [];
          for (let i = 0; i < dc.length; i++) { const d = dc[i]; if (!d) continue; (BIG_DECOR[decorKind(d)] ? e.big : e.small).push(d); }
          e.water = waterRects(world);
        }

      return e;
    },

    // ----- the main entry -----
    drawWorld(ctx, game, cam, t) {
      this._bind();
      t = t || 0;
      const VW = (AT.CFG && AT.CFG.VIEW_W) || 960, VH = (AT.CFG && AT.CFG.VIEW_H) || 540;
      const level = (game && game.level) || {};
      const world = level.world || (game && game.world) || { w: 2000, h: 1500, theme: 'fields', obstacles: [], decor: [], water: [] };
      const player = (game && game.player) || AT.player;
      cam = cam || (game && game.cam) || { x: 0, y: 0 };
      const cx = Math.round(cam.x || 0), cy = Math.round(cam.y || 0);
      const theme = world.theme === 'ruins' ? 'ruins' : 'fields';
      this._cam = { x: cx, y: cy, w: VW, h: VH }; this._theme = theme;
      const bg = this._bg(world);

      ctx.save();
      if (theme === 'ruins') this._drawVoid(ctx, cx, cy, VW, VH, t);
      else { ctx.fillStyle = '#4a9a48'; ctx.fillRect(0, 0, VW, VH); }

      ctx.translate(-cx, -cy);
      const view = { x0: cx - 120, y0: cy - 160, x1: cx + VW + 120, y1: cy + VH + 160 };
      // static background
      if (bg && bg.canvas) {
        const pad = bg.pad, cw = bg.canvas.width, ch = bg.canvas.height;
        const sx = Math.max(0, cx + pad), sy = Math.max(0, cy + pad);
        const ex = Math.min(cw, cx + VW + pad), ey = Math.min(ch, cy + VH + pad);
        if (ex > sx && ey > sy) ctx.drawImage(bg.canvas, sx, sy, ex - sx, ey - sy, sx - pad, sy - pad, ex - sx, ey - sy);
      } else {
        ctx.fillStyle = theme === 'ruins' ? '#434b70' : '#78d45c'; ctx.fillRect(0, 0, world.w || 2000, world.h || 1500);
      }

      // animated ground layer
      const waters = bg ? bg.water : waterRects(world);
      for (let i = 0; i < waters.length; i++) { const q = waters[i]; if (q.x < view.x1 && q.x + q.w > view.x0 && q.y < view.y1 && q.y + q.h > view.y0) drawWater(ctx, q, t, theme); }
      if (bg) {
        const sw = bg.sway;
        for (let i = 0; i < sw.length; i++) { const s = sw[i]; if (s.x > view.x0 && s.x < view.x1 && s.y > view.y0 && s.y < view.y1) drawSway(ctx, s, t); }
        if (theme === 'ruins') this._drawRunes(ctx, bg.runes, view, t);
        for (let i = 0; i < bg.small.length; i++) { const d = bg.small[i]; if (d.x > view.x0 && d.x < view.x1 && d.y > view.y0 && d.y < view.y1) drawSmallDecor(ctx, d, t, theme); }
      }
      const obs = world.obstacles || [];
      const items = this._items; items.length = 0;
      for (let i = 0; i < obs.length; i++) {
        const o = obs[i]; const v = o.visual || (theme === 'ruins' ? 'ruin' : 'rock');
        if (v === 'water') continue;
        const circ = o.type === 'circle';
        const ox = circ ? o.x - o.r : o.x, oy = circ ? o.y - o.r : o.y, ow = circ ? o.r * 2 : o.w, oh = circ ? o.r * 2 : o.h;
        if (ox > view.x1 || ox + ow < view.x0 || oy - 120 > view.y1 || oy + oh < view.y0) continue;
        if (v === 'void') { drawVoidPit(ctx, o, t); continue; }
        items.push([circ ? o.y + o.r * 0.6 : o.y + o.h, 'o', o, v]);
      }
      if (bg) for (let i = 0; i < bg.big.length; i++) {
        const d = bg.big[i]; if (d.x < view.x0 || d.x > view.x1 || d.y < view.y0 - 120 || d.y > view.y1) continue;
        items.push([d.y + (d.h || (d.r || 16) * 0.5), 'd', d, decorKind(d)]);
      }

      // afterimages (below actors)
      if (player && player.afterimages && AT.Sprites) {
        const gh = this._ghost;
        for (let i = 0; i < player.afterimages.length; i++) {
          const a = player.afterimages[i]; if (!(a.life > 0)) continue;
          gh.x = a.x; gh.y = a.y; gh.facing = a.facing || 0;
          AT.Sprites.drawPlayer(ctx, gh, t, { ghost: true, alpha: clamp(a.life * 3, 0, 1) * 0.5 });
        }
      }
      // pickups
      const pk = level.pickups || [];
      for (let i = 0; i < pk.length; i++) { const p = pk[i]; if (p.x > view.x0 && p.x < view.x1 && p.y > view.y0 && p.y < view.y1) AT.Sprites.drawPickup(ctx, p, t); }
      // chests, enemies, boss, player into the sort list
      const ch = level.chests || [];
      for (let i = 0; i < ch.length; i++) { const c = ch[i]; if (c.x > view.x0 && c.x < view.x1 && c.y > view.y0 && c.y < view.y1) items.push([c.y + 4, 'c', c]); }
      const en = level.enemies || [];
      for (let i = 0; i < en.length; i++) { const e = en[i]; if (!e) continue; if (e.dead && (e.deathT || 0) > 0.4) continue; if (e.x > view.x0 && e.x < view.x1 && e.y > view.y0 && e.y < view.y1) items.push([e.y, 'e', e]); }
      const boss = level.boss;
      if (boss && !(boss.dead && (boss.deathT || 0) > 1)) items.push([boss.y, 'b', boss]);
      if (player) items.push([player.y, 'p', player]);
      items.sort(byY);
      for (let i = 0; i < items.length; i++) {
        const it = items[i], ref = it[2];
        ctx.save();
        switch (it[1]) {
          case 'o': case 'd': this._drawStatic(ctx, ref, it[3], t, theme); break;
          case 'c': AT.Sprites.drawChest(ctx, ref, t); break;
          case 'e': AT.Sprites.drawEnemy(ctx, ref, t); break;
          case 'b': AT.Sprites.drawBoss(ctx, ref, t); break;
          case 'p': AT.Sprites.drawPlayer(ctx, ref, t); break;
        }
        ctx.restore();
      }
      // enemy hp bars
      for (let i = 0; i < en.length; i++) {
        const e = en[i]; if (!e || e.dead || !(e.hp < e.maxHp)) continue;
        const w = 30, x = e.x - w / 2, y = e.y + (e.r || 14) + 6;
        ctx.fillStyle = 'rgba(10,10,30,0.7)'; ctx.fillRect(x - 1, y - 1, w + 2, 5);
        ctx.fillStyle = '#ff5a5a'; ctx.fillRect(x, y, w * clamp(e.hp / e.maxHp, 0, 1), 3);
        ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x, y, w * clamp(e.hp / e.maxHp, 0, 1), 1);
      }
      this._drawProjectiles(ctx, t);
      this._drawSlashes(ctx, t);
      if (AT.Particles) AT.Particles.draw(ctx, this._cam);
      ctx.restore();

      // ----- screen-space lighting -----
      ctx.save();
      this._drawLighting(ctx, theme, player, cx, cy, VW, VH, t);
      ctx.restore();

      // ----- world-space overlays that must stay readable: telegraphs, then numbers -----
      ctx.save(); ctx.translate(-cx, -cy);
      this._drawTelegraphs(ctx, level, t);
      this._drawFloatingText(ctx, t);
      ctx.restore();
    },

    _drawStatic(g, o, v, t, theme) {
      switch (v) {
        case 'tree': { const c = o.type === 'circle' || o.r ? o : { x: o.x + (o.w || 40) / 2, y: o.y + (o.h || 40) / 2, r: Math.min(o.w || 40, o.h || 40) / 2 }; drawTree(g, c, t); break; }
        case 'rock': case 'boulder': drawRock(g, o); break;
        case 'pillar': case 'column': case 'statue': case 'arch': drawPillar(g, o, t); break;
        case 'wall': case 'ruin': default:
          if (o.type === 'circle') { if (theme === 'ruins') drawPillar(g, o, t); else drawRock(g, o); }
          else if (v === 'rock') drawRock(g, o);
          else drawBlock(g, o.w != null ? o : { x: o.x - 30, y: o.y - 20, w: 60, h: 40 }, t, theme);
      }
    },

    _drawRunes(g, runes, view, t) {
      g.save(); g.globalCompositeOperation = 'lighter';
      for (let i = 0; i < runes.length; i++) {
        const r = runes[i]; if (r.x < view.x0 || r.x > view.x1 || r.y < view.y0 || r.y > view.y1) continue;
        const p = 0.5 + 0.5 * Math.sin(t * 1.8 + r.ph);
        g.strokeStyle = 'rgba(90,190,255,' + (0.35 + 0.5 * p).toFixed(2) + ')'; g.lineWidth = 2; g.lineCap = 'round';
        g.beginPath(); g.arc(r.x, r.y, r.r, 0, TAU); g.stroke();
        for (let k = 0; k < r.n * 2; k++) { const a = k / (r.n * 2) * TAU + t * 0.15; g.beginPath(); g.moveTo(r.x + Math.cos(a) * r.r * 0.65, r.y + Math.sin(a) * r.r * 0.65); g.lineTo(r.x + Math.cos(a + 0.2) * r.r * 0.9, r.y + Math.sin(a + 0.2) * r.r * 0.9); if (k % 2) g.lineTo(r.x + Math.cos(a - 0.1) * r.r * 0.8, r.y + Math.sin(a - 0.1) * r.r * 0.8); g.stroke(); }
        const gr = g.createRadialGradient(r.x, r.y, 0, r.x, r.y, r.r * 1.5); gr.addColorStop(0, 'rgba(80,170,255,' + (0.18 * p).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)');

      }
      g.restore();
    },

    _drawVoid(g, cx, cy, W, H, t) {
      const gr = g.createLinearGradient(0, 0, 0, H);
      gr.addColorStop(0, '#0a0924'); gr.addColorStop(0.6, '#1a2252'); gr.addColorStop(1, '#2d3d7c');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      for (let i = 0; i < 40; i++) { const x = hash(i, 3) * W, y = hash(i, 9) * H * 0.7, a = 0.3 + 0.5 * Math.abs(Math.sin(t * 1.3 + i)); g.fillStyle = 'rgba(220,230,255,' + (a * 0.6).toFixed(2) + ')'; g.fillRect(x, y, 1.5, 1.5); }
      for (let L = 0; L < 2; L++) {
        const par = 0.12 + L * 0.14, spd = 6 + L * 10;
        for (let i = 0; i < 7; i++) {
          const x = mod(i * 240 + t * spd - cx * par, W + 400) - 200, y = H * (0.55 + L * 0.2) + (i % 3) * 36 - cy * par * 0.4;
          g.fillStyle = 'rgba(' + (150 + L * 20) + ',' + (170 + L * 15) + ',235,' + (0.11 + L * 0.06) + ')';
          for (let k = 0; k < 4; k++) { g.beginPath(); g.ellipse(x + k * 34 - 50, y + Math.sin(k * 2 + i) * 6, 50 + (k % 2) * 16, 18 + L * 6, 0, 0, TAU); g.fill(); }
        }
      }
      // distant floating islands
      for (let i = 0; i < 3; i++) {
        const x = mod(i * 420 + 150 - cx * 0.08, W + 300) - 100, y = 90 + i * 60 + Math.sin(t * 0.5 + i) * 6;
        g.fillStyle = 'rgba(20,26,60,0.85)'; g.beginPath(); g.moveTo(x - 50, y); g.lineTo(x + 50, y); g.lineTo(x + 20, y + 30); g.lineTo(x, y + 52); g.lineTo(x - 22, y + 28); g.closePath(); g.fill();
        g.fillStyle = 'rgba(70,110,170,0.8)'; g.fillRect(x - 50, y - 3, 100, 4);
      }
    },

    _drawLighting(g, theme, player, cx, cy, W, H, t) {
      if (theme === 'ruins') {
        g.fillStyle = 'rgba(8,10,34,0.26)'; g.fillRect(0, 0, W, H);
        if (player) {
          const px = player.x - cx, py = player.y - cy - 10;
          const gr = g.createRadialGradient(px, py, 10, px, py, 290); gr.addColorStop(0, 'rgba(130,180,255,0.22)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
          g.globalCompositeOperation = 'lighter'; g.fillStyle = gr; g.fillRect(0, 0, W, H); g.globalCompositeOperation = 'source-over';
        }
        // low mist streaks
        g.fillStyle = 'rgba(170,190,255,0.05)';
        for (let i = 0; i < 4; i++) { const x = mod(i * 300 + t * (14 + i * 4) - cx * 0.4, W + 500) - 250, y = H * (0.2 + i * 0.22); g.beginPath(); g.ellipse(x, y, 230, 22, 0, 0, TAU); g.fill(); }
        const ph = mod(t, 9);
        if (ph < 0.18) { g.fillStyle = 'rgba(200,220,255,' + (0.14 * (1 - ph / 0.18)).toFixed(3) + ')'; g.fillRect(0, 0, W, H); }
        const vg = g.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.95); vg.addColorStop(0, 'rgba(0,0,16,0)'); vg.addColorStop(1, 'rgba(0,0,16,0.72)');
        g.fillStyle = vg; g.fillRect(0, 0, W, H);
      } else {
        g.fillStyle = 'rgba(255,214,140,0.06)'; g.fillRect(0, 0, W, H);
        // drifting cloud shadows
        g.fillStyle = 'rgba(30,70,60,0.07)';
        for (let i = 0; i < 4; i++) { const x = mod(i * 330 + t * 14 - cx * 0.9, W + 600) - 300, y = mod(i * 190 + 40 - cy * 0.9, H + 300) - 100; g.beginPath(); g.ellipse(x, y, 190, 70, -0.3, 0, TAU); g.fill(); }
        // sun shafts
        g.save(); g.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 5; i++) {
          const x0 = 80 + i * 210 + Math.sin(t * 0.3 + i * 1.7) * 28, wdt = 46 + (i % 3) * 22;
          const gr = g.createLinearGradient(x0, 0, x0 - 180, H); const a = (0.10 + 0.05 * Math.sin(t * 0.7 + i * 2.3)).toFixed(3);
          gr.addColorStop(0, 'rgba(255,236,170,' + a + ')'); gr.addColorStop(1, 'rgba(255,236,170,0)');
          g.fillStyle = gr; g.beginPath(); g.moveTo(x0, -10); g.lineTo(x0 + wdt, -10); g.lineTo(x0 + wdt - 300, H + 10); g.lineTo(x0 - 300, H + 10); g.closePath(); g.fill();
        }
        g.restore();
        const vg = g.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.98); vg.addColorStop(0, 'rgba(20,40,20,0)'); vg.addColorStop(1, 'rgba(14,30,18,0.4)');
        g.fillStyle = vg; g.fillRect(0, 0, W, H);
      }
    },

    _drawProjectiles(g, t) {
      const L = AT.Projectiles && AT.Projectiles.list; if (!L) return;
      for (let i = 0; i < L.length; i++) {
        const p = L[i]; if (!p || p.dead) continue;
        const c = ELC[p.element] || ELC.physical, r = p.r || 8;
        const sp = Math.hypot(p.vx || 0, p.vy || 0) || 1, dx = (p.vx || 0) / sp, dy = (p.vy || 0) / sp;
        g.save(); g.globalCompositeOperation = 'lighter';
        const gr = g.createLinearGradient(p.x, p.y, p.x - dx * r * 4, p.y - dy * r * 4); gr.addColorStop(0, c[1]); gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.strokeStyle = gr; g.lineWidth = r * 1.5; g.lineCap = 'round'; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - dx * r * 4, p.y - dy * r * 4); g.stroke();
        const rg = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.4); rg.addColorStop(0, c[0]); rg.addColorStop(0.35, c[1]); rg.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = rg; g.beginPath(); g.arc(p.x, p.y, r * 2.4, 0, TAU); g.fill();
        if (p.element === 'electro') {
          g.strokeStyle = c[0]; g.lineWidth = 1.4; g.beginPath(); const s = Math.floor(t * 20) + i;
          let ax = p.x, ay = p.y; g.moveTo(ax, ay); for (let k = 0; k < 3; k++) { ax += (hash(s, k) - 0.5) * r * 3.2; ay += (hash(k, s) - 0.5) * r * 3.2; g.lineTo(ax, ay); } g.stroke();
        }
        g.restore();
        g.fillStyle = '#ffffff'; g.beginPath(); g.arc(p.x, p.y, r * 0.45, 0, TAU); g.fill();
      }
    },

    _drawSlashes(g, t) {
      const H = AT.Combat && AT.Combat.activeHitboxes; if (!H) return;
      for (let i = 0; i < H.length; i++) {
        const h = H[i], dur = h.dur || 0.2, p = clamp((h.t || 0) / dur, 0, 1);
        const c = ELC[h.element] || ELC.physical;
        g.save(); g.globalCompositeOperation = 'lighter';
        if (h.shape === 'circle') {
          const e = 1 - Math.pow(1 - p, 3), rad = (h.r || h.range || 100) * (0.25 + 0.75 * e);
          const gr = g.createRadialGradient(h.x, h.y, rad * 0.5, h.x, h.y, rad); gr.addColorStop(0, 'rgba(255,140,40,0)'); gr.addColorStop(1, 'rgba(255,170,70,' + (0.5 * (1 - p)).toFixed(3) + ')');
          g.fillStyle = gr; g.beginPath(); g.arc(h.x, h.y, rad, 0, TAU); g.fill();
          g.strokeStyle = 'rgba(255,225,160,' + (0.9 * (1 - p)).toFixed(3) + ')'; g.lineWidth = 6 * (1 - p) + 1.5; g.beginPath(); g.arc(h.x, h.y, rad, 0, TAU); g.stroke();
          g.strokeStyle = 'rgba(255,120,40,' + (0.7 * (1 - p)).toFixed(3) + ')'; g.lineWidth = 3; g.beginPath(); g.arc(h.x, h.y, rad * 0.78, 0, TAU); g.stroke();
        } else {
          const range = h.range || h.r || 62, arc = h.arc || 2.4, a0 = (h.angle || 0) - arc / 2;

          const fade = Math.pow(1 - p, 1.4);

            g.beginPath(); g.arc(h.x, h.y, outer, from, to); g.arc(h.x, h.y, inner, to, from, true); g.closePath();
          };
          const big = h.element === 'pyro';
          crescent(a0, a0 + sweep, range * (big ? 0.35 : 0.6), range * 1.02);
          g.fillStyle = (big ? 'rgba(255,140,50,' : 'rgba(190,235,255,') + (0.42 * fade).toFixed(3) + ')'; g.fill();
          crescent(Math.max(a0, a0 + sweep - arc * 0.35), a0 + sweep, range * (big ? 0.6 : 0.78), range * 1.02);

        }
        g.restore();
      }
    },

    _drawTelegraphs(g, level, t) {
      const draw = (tg) => { if (tg && tg.shape) drawTelegraph(g, tg, t); };
      const en = level.enemies || [];
      for (let i = 0; i < en.length; i++) { const e = en[i]; if (e && !e.dead) draw(e.telegraph); }
      const b = level.boss;
      if (b && !b.dead) { if (b.telegraphs && b.telegraphs.length) for (let i = 0; i < b.telegraphs.length; i++) draw(b.telegraphs[i]); else draw(b.telegraph); }
    },

    _drawFloatingText(g, t) {
      const L = this.floatingText;
      g.save(); g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
      for (let i = 0; i < L.length; i++) {
        const f = L[i], k = f.age / f.life;
        const pop = 1 + 0.45 * Math.max(0, 1 - f.age * 7);
        g.globalAlpha = clamp((1 - k) * 3, 0, 1);
        const sz = f.size * pop;
        g.font = 'bold ' + Math.round(sz) + 'px Georgia, "Times New Roman", serif';
        if (f.kind === 'vaporize') {
          g.font = 'bold italic ' + Math.round(sz) + 'px Georgia, "Times New Roman", serif';
          const w = g.measureText ? (g.measureText(f.text).width || 80) : 80;
          const gr = g.createLinearGradient(f.x, f.y - sz / 2, f.x, f.y + sz / 2);
          gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.5, '#ffe2b0'); gr.addColorStop(1, '#ff8a2a');
          g.shadowColor = 'rgba(255,140,40,0.9)'; g.shadowBlur = 10;
          g.strokeStyle = '#7a2208'; g.lineWidth = 5; g.strokeText(f.text, f.x, f.y);
          g.shadowBlur = 0; g.fillStyle = gr; g.fillText(f.text, f.x, f.y);
          g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 1; g.beginPath(); g.moveTo(f.x - w / 2, f.y + sz * 0.62); g.lineTo(f.x + w / 2, f.y + sz * 0.62); g.stroke();
        } else {
          g.strokeStyle = f.kind === 'hurt' ? '#3a0a0a' : 'rgba(20,16,40,0.9)'; g.lineWidth = f.kind === 'reaction' || f.kind === 'crit' ? 4.5 : 3.5;
          g.strokeText(f.text, f.x, f.y);
          g.fillStyle = f.color; g.fillText(f.text, f.x, f.y);
        }

// Aether's Trial — keyboard input. Owner: core.
(function () {
  const AT = globalThis.AT;

  const ARROWS = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1 };
  const GAMEPLAY = {
    KeyW: 1, KeyA: 1, KeyS: 1, KeyD: 1, Space: 1, ShiftLeft: 1, ShiftRight: 1,
    KeyE: 1, KeyQ: 1, KeyF: 1, KeyH: 1, KeyP: 1, Escape: 1, Tab: 1
  };

  const Input = {
    down: {},          // code -> true while held
    _pressed: {},      // code -> true for the frame the key went down
    _released: {},
    mouse: { x: 0, y: 0, down: false },
    _target: null,
    _handlers: null,

    bind(target) {
      if (this._target === target) return this;      // idempotent
      if (this._target) this.unbind();
      if (!target || !target.addEventListener) return this;
      const self = this;
      const h = {
        keydown(e) {
          const code = e.code;
          if (!code) return;
          if (self._isTextTarget(e)) return;
          if (self.shouldPreventDefault(code, e)) e.preventDefault();
          if (e.repeat) return;
          if (!self.down[code]) self._pressed[code] = true;
          self.down[code] = true;
        },
        keyup(e) {
          const code = e.code;
          if (!code) return;
          if (self._isTextTarget(e)) return;
          if (self.shouldPreventDefault(code, e)) e.preventDefault();
          if (self.down[code]) self._released[code] = true;
          delete self.down[code];
        },
        blur() { self.clear(); },
        visibility() { if (typeof document !== 'undefined' && document.hidden) self.clear(); }
      };
      this._handlers = h;
      this._target = target;
      target.addEventListener('keydown', h.keydown);
      target.addEventListener('keyup', h.keyup);
      target.addEventListener('blur', h.blur);
      if (typeof window !== 'undefined' && target !== window) window.addEventListener('blur', h.blur);
      if (typeof document !== 'undefined') document.addEventListener('visibilitychange', h.visibility);
      return this;
    },

    unbind() {
      const t = this._target, h = this._handlers;
      if (!t || !h) return;
      t.removeEventListener('keydown', h.keydown);
      t.removeEventListener('keyup', h.keyup);
      t.removeEventListener('blur', h.blur);
      if (typeof window !== 'undefined' && t !== window) window.removeEventListener('blur', h.blur);

    _isTextTarget(e) {

    shouldPreventDefault(code, e) {
      if (e && (e.ctrlKey || e.metaKey || e.altKey)) return false;
      if (code === 'Space' || ARROWS[code]) return true;           // never let the page scroll
      const st = AT.Game && AT.Game.state;

    },

    isDown(code) { return !!this.down[code]; },
    /** Edge-triggered: true during the frame the key went down (until endFrame()). */
    pressed(code) { return !!this._pressed[code]; },
    released(code) { return !!this._released[code]; },
    anyDown(codes) { for (let i = 0; i < codes.length; i++) if (this.down[codes[i]]) return true; return false; },
    anyPressed(codes) { for (let i = 0; i < codes.length; i++) if (this._pressed[codes[i]]) return true; return false; },

// Aether's Trial — camera: smooth follow, world clamp, screen shake. Owner: core.

  const AT = globalThis.AT;

  function create(w, h) {
    const cfg = AT.CFG || {};

      x: 0, y: 0,              // top-left of view in world space (includes shake offset)
      baseX: 0, baseY: 0,      // top-left without shake
      w: w || cfg.VIEW_W || 960,
      h: h || cfg.VIEW_H || 540,
      shakeT: 0, shakeDur: 0, shakeMag: 0, shakeX: 0, shakeY: 0,

      /** Add screen shake. A weaker shake never overrides a stronger running one. */

        if (mag >= cur) { this.shakeMag = mag; this.shakeDur = dur; this.shakeT = dur; }
      },

      _clamp(world) {
        const ww = world && world.w, wh = world && world.h;
        if (ww == null || wh == null) return;
        this.baseX = ww <= this.w ? (ww - this.w) / 2 : AT.clamp(this.baseX, 0, ww - this.w);
        this.baseY = wh <= this.h ? (wh - this.h) / 2 : AT.clamp(this.baseY, 0, wh - this.h);
      },

      /** Jump straight to the target. */
      snap(target, world) {
        if (target) { this.baseX = target.x - this.w / 2; this.baseY = target.y - this.h / 2; }
        this._clamp(world);
        this.shakeT = 0; this.shakeX = 0; this.shakeY = 0;
        this.x = this.baseX; this.y = this.baseY;
      },

      /** Frame-rate independent smooth follow + shake decay. */
      update(dt, target, world) {
        dt = dt || 0;
        if (target) {
          const k = 1 - Math.exp(-((cfg.CAMERA && cfg.CAMERA.follow) || 8) * dt);
          const tx = target.x - this.w / 2, ty = target.y - this.h / 2;
          this.baseX += (tx - this.baseX) * k;
          this.baseY += (ty - this.baseY) * k;
        }
        this._clamp(world);
        if (this.shakeT > 0) {
          this.shakeT = Math.max(0, this.shakeT - dt);
          const f = this.shakeDur > 0 ? this.shakeT / this.shakeDur : 0;
          const m = this.shakeMag * f;
          this.shakeX = (Math.random() * 2 - 1) * m;
          this.shakeY = (Math.random() * 2 - 1) * m;
          if (this.shakeT === 0) { this.shakeMag = 0; this.shakeDur = 0; }
        } else { this.shakeX = 0; this.shakeY = 0; }

        this.y = this.baseY + this.shakeY;

      worldToScreen(wx, wy) { return { x: wx - this.x, y: wy - this.y }; },
      screenToWorld(sx, sy) { return { x: sx + this.x, y: sy + this.y }; },
      isVisible(wx, wy, margin) {

      }
    };
    return cam;
  }

  AT.Camera = { create };
})();

      afterimages: [],
      // internal
      _act: null, _actT: 0, _hurtT: 0, _lastHp: P.baseHp, _afterT: 0
    };
    if (AT.Progression && typeof AT.Progression.applyToPlayer === 'function') AT.Progression.applyToPlayer(p);
    p.hp = p.maxHp;
    p._lastHp = p.hp;
    AT.player = p;
    return p;
  }

  function nearestEnemy(p, enemies, range) {
    let best = null, bd = range * range;
    if (!enemies) return null;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e || e.dead) continue;
      const dx = e.x - p.x, dy = e.y - p.y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }

  function resolveWorld(p, world) {
    if (!world) return;
    const Col = AT.Collision;
    if (Col && Col.resolveCircleVsObstacles && world.obstacles) Col.resolveCircleVsObstacles(p, world.obstacles);
    if (Col && Col.clampToWorld) Col.clampToWorld(p, world);
    else if (world.w != null && world.h != null) {
      p.x = AT.clamp(p.x, p.r, world.w - p.r);
      p.y = AT.clamp(p.y, p.r, world.h - p.r);
    }
  }

  /** Move in sub-steps so fast dashes cannot tunnel through obstacles. */
  function moveWithCollision(p, dx, dy, world) {
    const dist = Math.hypot(dx, dy);
    const n = Math.max(1, Math.ceil(dist / Math.max(4, p.r * 0.6)));
    const sx = dx / n, sy = dy / n;
    for (let i = 0; i < n; i++) { p.x += sx; p.y += sy; resolveWorld(p, world); }
  }

  function setAnim(p, name, dt) {
    if (p.anim !== name) { p.anim = name; p.animT = 0; }
    else p.animT += dt;
  }

  function update(a, b, c) {
    let p, dt, ctx;
    if (a && typeof a === 'object') { p = a; dt = b; ctx = c || {}; }
    else { dt = a; ctx = b || {}; p = ctx.player || AT.player; }
    if (!p) return p;
    const C = CFG();
    dt = Math.max(0, Math.min(dt || 0, C.MAX_DT));
    const In = ctx.input || AT.Input;
    const world = ctx.world;

    // ---- timers ----
    const tick = (k) => { if (p[k] > 0) p[k] = Math.max(0, p[k] - dt); };
    tick('invuln'); tick('hitFlash'); tick('dashCd'); tick('atkCd'); tick('skillCd');
    tick('swinging'); tick('_hurtT'); tick('_actT');
    if (p._actT <= 0) p._act = null;
    if (!p.kb) p.kb = { x: 0, y: 0 };

    // afterimages always fade out
    const ai = p.afterimages;
    for (let i = ai.length - 1; i >= 0; i--) { ai[i].life -= dt; if (ai[i].life <= 0) ai.splice(i, 1); }

    // damage taken this frame -> hurt flag
    if (p.hp < p._lastHp) p._hurtT = 0.25;
    p._lastHp = p.hp;

    if (!p.dead && p.hp <= 0) { p.hp = 0; p.dead = true; p.animT = 0; }

    // ---- dead: only knockback drift ----
    if (p.dead) {
      p.moving = false; p.vx = 0; p.vy = 0; p.dashTime = 0;
      if (Math.abs(p.kb.x) + Math.abs(p.kb.y) > 1) {
        moveWithCollision(p, p.kb.x * dt, p.kb.y * dt, world);
        const f = Math.exp(-10 * dt); p.kb.x *= f; p.kb.y *= f;
      }
      setAnim(p, 'dead', dt);
      return p;
    }

    // ---- input ----
    const ax = In ? In.axis() : { x: 0, y: 0 };
    let mx = ax.x, my = ax.y;
    const mlen = Math.hypot(mx, my);
    if (mlen > 0) { mx /= mlen; my /= mlen; }          // normalized diagonals
    const hasMove = mlen > 0;
    const pressed = (k) => !!(In && In.pressed(k));
    const held = (k) => !!(In && In.isDown(k));

    // ---- dash ----
    if (p.dashTime <= 0 && p.dashCd <= 0 && (pressed('ShiftLeft') || pressed('ShiftRight'))) {
      const D = C.DASH;
      const dx = hasMove ? mx : Math.cos(p.facing), dy = hasMove ? my : Math.sin(p.facing);
      p.dashDir = { x: dx, y: dy };
      p.dashTime = D.duration; p.dashCd = D.cooldown;
      p.invuln = Math.max(p.invuln, D.invuln);
      p._afterT = 0;
      if (hasMove) p.facing = Math.atan2(dy, dx);
      if (AT.events) AT.events.emit('dash', { x: p.x, y: p.y, angle: p.facing });
    }
    const dashing = p.dashTime > 0;

    // ---- actions (not while dashing) ----
    if (!dashing) {
      const wantsAct = held('Space') || held('KeyE') || pressed('KeyQ');
      if (wantsAct && !hasMove && p.swinging <= 0) {   // keyboard aim assist when standing still
        const t = nearestEnemy(p, ctx.enemies, 170);
        if (t) p.facing = Math.atan2(t.y - p.y, t.x - p.x);
      }
      const cctx = { enemies: ctx.enemies || [], world: world, level: ctx.level, player: p };
      const Cb = AT.Combat;
      if (Cb) {
        if (pressed('KeyQ') && typeof Cb.playerBurst === 'function') {
          p.swingAngle = p.facing;
          if (Cb.playerBurst(p, cctx)) {
            const B = C.BURST;
            p._act = 'burst'; p._actT = (B.ticks || 3) * (B.tickInterval || 0.18) + 0.25;
            p.invuln = Math.max(p.invuln, B.invuln || 0);
          }
        }
        if (held('KeyE') && typeof Cb.playerSkill === 'function') {
          p.swingAngle = p.facing;
          if (Cb.playerSkill(p, cctx)) { p._act = 'skill'; p._actT = C.SKILL.duration; }
        }
        if (held('Space') && typeof Cb.playerSword === 'function') {
          p.swingAngle = p.facing;
          if (Cb.playerSword(p, cctx)) {
            p._act = 'attack'; p._actT = C.SWORD.duration;
            if (!(p.swinging > 0)) p.swinging = C.SWORD.duration;
          }
        }
      }
      if (pressed('KeyF') && AT.Loot && typeof AT.Loot.interact === 'function') AT.Loot.interact(p, ctx.level);
      if (pressed('KeyH') && AT.Inventory && typeof AT.Inventory.usePotion === 'function') AT.Inventory.usePotion(p);
    } else {
      // interact / potion still allowed mid-dash
      if (pressed('KeyH') && AT.Inventory && typeof AT.Inventory.usePotion === 'function') AT.Inventory.usePotion(p);
    }

    // ---- velocity ----
    if (dashing) {
      p.dashTime = Math.max(0, p.dashTime - dt);
      p.vx = p.dashDir.x * C.DASH.speed; p.vy = p.dashDir.y * C.DASH.speed;
      p._afterT -= dt;
      if (p._afterT <= 0) {
        p._afterT = 0.03;
        ai.push({ x: p.x, y: p.y, facing: p.facing, life: 0.28 });
        const cap = (C.LIMITS && C.LIMITS.afterimages) || 8;
        while (ai.length > cap) ai.shift();
      }
    } else {
      p.vx = mx * p.speed; p.vy = my * p.speed;
      if (hasMove && !(p.swinging > 0)) p.facing = Math.atan2(my, mx);
    }
    p.moving = hasMove || dashing;

    // ---- integrate + collide ----
    const dx = (p.vx + p.kb.x) * dt, dy = (p.vy + p.kb.y) * dt;
    if (dx !== 0 || dy !== 0) moveWithCollision(p, dx, dy, world); else resolveWorld(p, world);
    const f = Math.exp(-10 * dt);
    p.kb.x *= f; p.kb.y *= f;
    if (Math.abs(p.kb.x) < 1) p.kb.x = 0;
    if (Math.abs(p.kb.y) < 1) p.kb.y = 0;

    // ---- animation state ----
    let anim = 'idle';
    if (p._hurtT > 0) anim = 'hurt';
    else if (dashing) anim = 'dash';
    else if (p._act === 'burst') anim = 'burst';
    else if (p._act === 'skill') anim = 'skill';
    else if (p._act === 'attack' || p.swinging > 0) anim = 'attack';
    else if (p.moving) anim = 'run';
    setAnim(p, anim, dt);
    return p;
  }

  AT.Player = { create, update, nearestEnemy };
})();

/* ==== engine.js ==== */
// Aether's Trial — engine: game loop, state machine, canvas fit, click handling. Owner: core. Loaded last.
(function () {
  const AT = globalThis.AT;
  const has = (m, f) => !!(AT[m] && typeof AT[m][f] === 'function');
  const flow = (k, d) => (AT.CFG && AT.CFG.FLOW && AT.CFG.FLOW[k] != null) ? AT.CFG.FLOW[k] : d;
  const WORLD_STATES = { playing: 1, paused: 1, levelComplete: 1, gameOver: 1, victory: 1 };

  const Game = {
    state: 'title',
    levelIndex: 0,
    level: null,
    player: null,
    cam: null,
    time: 0,
    enemies: [],          // living + dead regulars and boss of the current level (rebuilt every step)
    canvas: null, ctx: null,
    viewScale: 1,
    cinematicPlayed: false,
    deathT: 0, completeT: 0,
    _raf: 0, _token: 0, _last: null,
    _wired: false, _eventsBound: false, _audioReady: false, _errLogged: {},

    // ------------------------------------------------------------ state
    setState(s) {
      if (s === this.state) return;
      const from = this.state;
      this.state = s;
      if (from === 'cinematic' && typeof document !== 'undefined') {
        const el = document.getElementById('narrFallback');
        if (el) { el.style.display = 'none'; el.hidden = true; }
      }
      if (AT.events) AT.events.emit('statechange', { from, to: s });
    },

    pause() { if (this.state === 'playing') this.setState('paused'); },
    resume() { if (this.state === 'paused') { if (AT.Input) AT.Input.clear(); this.setState('playing'); } },

    /** New run from the title / victory screen. */
    startGame() {
      if (has('Progression', 'reset')) AT.Progression.reset();
      this.levelIndex = 0;
      const C = AT.Cinematic;
      if (C && !C.played && !this.cinematicPlayed && has('Cinematic', 'start')) {
        this.cinematicPlayed = true;           // never replay, even if the module forgets to set its flag
        C.start();
        this.setState('cinematic');
      } else {
        this.beginLevel(0);
      }
    },

    _finishCinematic() {
      if (AT.Cinematic) AT.Cinematic.played = true;
      this.cinematicPlayed = true;
      this.beginLevel(0);
    },

    beginLevel(i) {
      if (has('Progression', 'beginLevel')) AT.Progression.beginLevel(i);
      this._loadLevel(i);
      this.setState('playing');
    },

    /** Restore the level-entry snapshot and reload the same level. Never plays the cinematic. */
    retry() {
      if (has('Progression', 'retryLevel')) AT.Progression.retryLevel();
      this._loadLevel(this.levelIndex);
      this.setState('playing');
    },

    nextLevel() {
      const next = this.levelIndex + 1;
      const total = (AT.CFG.LEVELS && AT.CFG.LEVELS.length) || 2;
      if (next >= total) { this._victory(); return; }
      this.beginLevel(next);
    },

    toTitle() {
      this.level = null;
      this.setState('title');
    },

    _victory() {
      this.setState('victory');
      if (AT.events) AT.events.emit('victory', {});
    },

    _loadLevel(i) {
      this.levelIndex = i;
      if (has('Projectiles', 'clear')) AT.Projectiles.clear();
      if (has('Particles', 'clear')) AT.Particles.clear();
      if (has('Combat', 'reset')) AT.Combat.reset();
      if (AT.Combat && Array.isArray(AT.Combat.activeHitboxes)) AT.Combat.activeHitboxes.length = 0;
      if (AT.Renderer && Array.isArray(AT.Renderer.floatingText)) AT.Renderer.floatingText.length = 0;

      const seed = ((AT.CFG.SEED != null ? AT.CFG.SEED : 1337) + i * 101) >>> 0;
      this.level = has('Levels', 'load') ? AT.Levels.load(i, AT.rng(seed)) : null;
      const world = this.level && this.level.world;

      const p = AT.Player.create();
      const start = (world && world.playerStart) || { x: (world && world.w / 2) || 0, y: (world && world.h / 2) || 0 };
      p.x = start.x; p.y = start.y;
      this.player = p; AT.player = p;

      if (!this.cam) this.cam = AT.Camera.create(AT.CFG.VIEW_W, AT.CFG.VIEW_H);
      this.cam.snap(p, world);
      this.time = 0; this.deathT = 0; this.completeT = 0;
      this._rebuildEnemies();
      if (AT.Input) AT.Input.clear();
    },

    _rebuildEnemies() {
      const out = this.enemies; out.length = 0;
      const lv = this.level;
      if (!lv) return;
      if (lv.enemies) for (let i = 0; i < lv.enemies.length; i++) out.push(lv.enemies[i]);
      if (lv.boss) out.push(lv.boss);
    },

    _ctx() {
      const lv = this.level;
      return {
        player: this.player, enemies: this.enemies, world: lv && lv.world, level: lv,
        obstacles: lv && lv.world && lv.world.obstacles, game: this, input: AT.Input
      };
    },

    // ------------------------------------------------------------ simulation
    /** Pure simulation step; safe from Node (no DOM). Gameplay only advances while state === 'playing'. */
    step(dt) {
      dt = Math.max(0, Math.min(+dt || 0, AT.CFG.MAX_DT));
      const st = this.state;

      if (st === 'cinematic') {
        const C = AT.Cinematic;
        if (!C || !has('Cinematic', 'update') || C.update(dt) === true) this._finishCinematic();
        return;
      }
      if (st === 'playing' && this.level && this.player) {
        this.time += dt;
        this._rebuildEnemies();
        const ctx = this._ctx();
        const p = this.player, lv = this.level;

        AT.Player.update(p, dt, ctx);
        if (has('Combat', 'update')) AT.Combat.update(dt, ctx);
        if (has('Projectiles', 'update')) AT.Projectiles.update(dt, ctx);
        if (has('Levels', 'update')) AT.Levels.update(dt, lv, p);
        this._rebuildEnemies();
        if (has('Loot', 'update')) AT.Loot.update(dt, lv, p);
        this.cam.update(dt, p, lv.world);
        this._fx(dt);

        if (p.dead || p.hp <= 0) {
          this.deathT += dt;
          if (this.deathT >= flow('deathDelay', 0.8)) { this.setState('gameOver'); return; }
        }
        if (lv.completed && !p.dead) {
          this.completeT += dt;
          if (this.completeT >= flow('completeDelay', 0.5)) {
            const total = (AT.CFG.LEVELS && AT.CFG.LEVELS.length) || 2;
            if (this.levelIndex + 1 >= total) this._victory(); else this.setState('levelComplete');
          }
        }
        return;
      }
      if ((st === 'levelComplete' || st === 'gameOver' || st === 'victory') && this.level) {
        // purely cosmetic: let particles / floating text / camera settle; no gameplay
        this.cam.update(dt, null, this.level.world);
        this._fx(dt);
      }
      // title / paused: nothing advances
    },

    _fx(dt) {
      if (has('Particles', 'update')) AT.Particles.update(dt);
      if (has('Renderer', 'update')) AT.Renderer.update(dt);
      if (has('HUD', 'update')) AT.HUD.update(dt, this);
    },

    // ------------------------------------------------------------ input -> state transitions
    handleInput() {
      const In = AT.Input; if (!In) return;
      const enter = In.pressed('Enter') || In.pressed('NumpadEnter');
      const esc = In.pressed('Escape');
      switch (this.state) {
        case 'title': if (enter || In.pressed('Space')) this.startGame(); break;
        case 'cinematic':
          if (enter || esc) { if (has('Cinematic', 'skip')) AT.Cinematic.skip(); this._finishCinematic(); }
          break;
        case 'playing': if (esc || In.pressed('KeyP')) this.pause(); break;
        case 'paused': if (esc || In.pressed('KeyP') || enter) this.resume(); break;
        case 'levelComplete': if (enter) this.nextLevel(); break;
        case 'gameOver': if (enter || In.pressed('KeyR')) this.retry(); break;
        case 'victory': if (enter) this.toTitle(); break;
      }
    },

    _toLogical(e) {
      const c = this.canvas; if (!c) return null;
      const r = c.getBoundingClientRect();
      if (!r.width || !r.height) return null;
      return { x: (e.clientX - r.left) * AT.CFG.VIEW_W / r.width, y: (e.clientY - r.top) * AT.CFG.VIEW_H / r.height };
    },

    _hitButton(pt) {
      const bs = AT.HUD && AT.HUD.buttons;
      if (!pt || !bs) return null;
      for (let i = bs.length - 1; i >= 0; i--) {
        const b = bs[i]; if (!b) continue;
        const w = b.w != null ? b.w : b.width, h = b.h != null ? b.h : b.height;
        if (pt.x >= b.x && pt.x <= b.x + w && pt.y >= b.y && pt.y <= b.y + h && b.disabled !== true) return b;
      }
      return null;
    },

    onClick(e) {
      this._initAudio();
      const pt = this._toLogical(e);
      const b = this._hitButton(pt);
      if (b) {
        if (has('Audio', 'play')) { try { AT.Audio.play('click'); } catch (_) {} }
        if (typeof b.onClick === 'function') { b.onClick(); return; }
        this.doAction(b.action || b.id || b.name || b.type || b.label);
        return;
      }
      if (this.state === 'title') this.startGame();
    },

    doAction(name) {
      const a = String(name || '').toLowerCase().replace(/[\s_-]/g, '');
      const st = this.state;
      switch (a) {
        case 'start': case 'play': case 'newgame': case 'begin': case 'startgame':
          if (st === 'title' || st === 'victory') { if (st === 'victory') this.toTitle(); this.startGame(); } break;
        case 'resume': case 'continue': this.resume(); break;
        case 'pause': this.pause(); break;
        case 'retry': case 'tryagain': if (st === 'gameOver') this.retry(); break;
        case 'restart':
          if (st === 'gameOver') this.retry();
          else if (st === 'victory') { this.toTitle(); this.startGame(); }
          else if (st === 'paused') { this.setState('playing'); this.retry(); }
          break;
        case 'next': case 'nextlevel': case 'continuenext': if (st === 'levelComplete') this.nextLevel(); break;
        case 'title': case 'menu': case 'home': case 'quit': case 'mainmenu': this.toTitle(); break;
      }
    },

    _initAudio() {
      if (this._audioReady) return;
      this._audioReady = true;
      if (has('Audio', 'init')) { try { AT.Audio.init(); } catch (e) { /* audio is optional */ } }
    },

    // ------------------------------------------------------------ browser wiring
    _bindEvents() {
      if (this._eventsBound || !AT.events) return;
      this._eventsBound = true;
      const sh = (m, d) => { if (this.cam) this.cam.shake(m, d); };
      AT.events.on('playerHurt', () => sh(5, 0.2));
      AT.events.on('burstCast', () => sh(7, 0.3));
      AT.events.on('bossDefeated', () => sh(9, 0.6));
      AT.events.on('hit', (e) => { if (e && e.heavy) sh(3, 0.12); });
      if (has('Audio', 'bind')) AT.Audio.bind();
      if (has('Particles', 'bind')) AT.Particles.bind();
      if (has('Progression', 'bind')) AT.Progression.bind();
    },

    resize() {
      const c = this.canvas; if (!c || typeof window === 'undefined') return;
      const VW = AT.CFG.VIEW_W, VH = AT.CFG.VIEW_H;
      const aw = Math.max(160, window.innerWidth || VW), ah = Math.max(90, window.innerHeight || VH);
      const s = Math.min(aw / VW, ah / VH);
      const cw = Math.floor(VW * s), ch = Math.floor(VH * s);
      const dpr = window.devicePixelRatio || 1;
      c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr);
      c.style.width = cw + 'px'; c.style.height = ch + 'px';
      c.style.position = 'absolute';
      c.style.left = Math.floor((aw - cw) / 2) + 'px';
      c.style.top = Math.floor((ah - ch) / 2) + 'px';
      this.viewScale = c.width / VW;
    },

    start(canvas) {
      if (!this.cam && AT.Camera) this.cam = AT.Camera.create(AT.CFG.VIEW_W, AT.CFG.VIEW_H);
      this._bindEvents();
      if (!canvas) return this;                     // headless
      this.canvas = canvas;
      this.ctx = canvas.getContext ? canvas.getContext('2d') : null;
      this.resize();

      if (!this._wired && typeof window !== 'undefined') {
        this._wired = true;
        if (AT.Input) AT.Input.bind(window);
        window.addEventListener('resize', () => this.resize());
        canvas.addEventListener('click', (e) => this.onClick(e));
        canvas.addEventListener('mousemove', (e) => {
          const pt = this._toLogical(e); if (!pt) return;
          if (AT.Input) { AT.Input.mouse.x = pt.x; AT.Input.mouse.y = pt.y; }
          canvas.style.cursor = this._hitButton(pt) ? 'pointer' : 'default';
        });
        const gesture = () => this._initAudio();
        window.addEventListener('keydown', gesture);
        window.addEventListener('pointerdown', gesture);
        window.addEventListener('blur', () => this.pause());           // never lose progress to a background tab
        document.addEventListener('visibilitychange', () => { if (document.hidden) this.pause(); this._last = null; });
      }

      // single rAF loop: cancel any previous one, invalidate its token
      if (this._raf && typeof cancelAnimationFrame === 'function') cancelAnimationFrame(this._raf);
      const token = ++this._token;
      this._last = null;
      const frame = (ts) => {
        if (token !== this._token) return;          // stale loop
        this._raf = requestAnimationFrame(frame);
        try { this._frame(ts); }
        catch (err) {
          const k = String(err && err.message);
          if (!this._errLogged[k]) { this._errLogged[k] = true; if (typeof console !== 'undefined') console.error('[AT.Game frame]', err); }
        }
      };
      this._raf = requestAnimationFrame(frame);
      return this;
    },

    stop() {
      this._token++;
      if (this._raf && typeof cancelAnimationFrame === 'function') cancelAnimationFrame(this._raf);
      this._raf = 0;
    },

    _frame(ts) {
      let dt = this._last == null ? 0 : (ts - this._last) / 1000;
      this._last = ts;
      if (!(dt > 0)) dt = 0;
      dt = Math.min(dt, AT.CFG.MAX_DT);
      this.handleInput();
      this.step(dt);
      if (AT.Input) AT.Input.endFrame();
      this.draw();
    },

    draw() {
      const ctx = this.ctx, c = this.canvas; if (!ctx || !c) return;
      const W = AT.CFG.VIEW_W, H = AT.CFG.VIEW_H, k = c.width / W;
      ctx.setTransform(k, 0, 0, k, 0, 0);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#0b1020';
      ctx.fillRect(0, 0, W, H);
      const st = this.state;
      if (st === 'cinematic') {
        if (has('Cinematic', 'draw')) AT.Cinematic.draw(ctx, W, H);
        return;
      }
      const inWorld = !!WORLD_STATES[st] && this.level;
      if (inWorld && has('Renderer', 'drawWorld')) AT.Renderer.drawWorld(ctx, this, this.cam, this.time);
      if (inWorld && has('HUD', 'draw')) AT.HUD.draw(ctx, this);
      if (has('HUD', 'drawScreen')) AT.HUD.drawScreen(ctx, this);
    }
  };

  AT.Game = Game;

  // ---- boot (browser only) ----
  if (typeof document !== 'undefined') {
    const boot = () => {
      const c = document.querySelector('canvas#game');
      if (c) Game.start(c);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})();
