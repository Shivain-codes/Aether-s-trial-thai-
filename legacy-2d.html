<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aether's Trial</title>
<style>
/* Aether's Trial: page styles. No external fonts or assets. */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, #121a33 0%, #070a14 70%, #03050b 100%);
  color: #f4ecd6;
  font-family: Georgia, "Palatino Linotype", "Book Antiqua", Palatino, "Times New Roman", serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

canvas#game, #game {
  display: block;
  max-width: 100vw;
  max-height: 100vh;
  width: auto;
  height: auto;
  aspect-ratio: 16 / 9;
  background: #0b1020;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
  image-rendering: pixelated;
  box-shadow: 0 0 60px rgba(90, 140, 255, 0.25), 0 0 0 1px rgba(255, 220, 140, 0.18);
  outline: none;
  touch-action: none;
  cursor: default;
}

/* Subtitle fallback overlay (used when a canvas subtitle cannot be drawn). Hidden unless .show is set. */
#narrFallback {
  position: fixed;
  left: 50%;
  bottom: 9%;
  transform: translateX(-50%);
  max-width: min(86vw, 900px);
  padding: 8px 18px;
  text-align: center;
  font-family: Georgia, "Palatino Linotype", Palatino, serif;
  font-size: clamp(14px, 2.4vw, 24px);
  line-height: 1.35;
  letter-spacing: 0.02em;
  color: #fff6dc;
  text-shadow: 0 0 6px rgba(0, 0, 0, 0.95), 0 2px 3px rgba(0, 0, 0, 0.9);
  background: rgba(8, 12, 28, 0.55);
  border-radius: 6px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s ease;
  z-index: 20;
}
#narrFallback.show { opacity: 1; }
#narrFallback:empty { display: none; }

noscript, .noscript {
  color: #f4ecd6;
  font-family: Georgia, serif;
}

</style></head>
<body>
<canvas id="game" width="960" height="540" tabindex="0"></canvas>
<div id="narrFallback"></div>
<script>
/* ==== config.js ==== */
// Aether's Trial — central configuration, event bus, shared helpers. Owner: orchestrator.
const AT = (globalThis.AT = globalThis.AT || {});

AT.CFG = {
  VIEW_W: 960, VIEW_H: 540,
  MAX_DT: 0.05,

  PLAYER: { radius: 13, speed: 175, baseHp: 100, hpPerLevel: 18, baseAtk: 10, atkPerLevel: 3,
            maxEnergy: 60, invulnAfterHit: 0.6, hurtKnock: 160, healOnLevelUp: 0.4 },
  SWORD:  { cooldown: 0.38, damageMul: 1.0, range: 62, arc: Math.PI * 0.85, duration: 0.2, hitDelay: 0.06,
            knockback: 190, lunge: 60, comboWindow: 0.6, comboMul: [1.0, 1.0, 1.35] },
  SKILL:  { cooldown: 5, damageMul: 1.7, range: 120, arc: Math.PI * 0.7, duration: 0.3, hitDelay: 0.08,
            knockback: 260, energyGain: 12 },
  BURST:  { cost: 60, damageMul: 3.4, radius: 175, ticks: 3, tickInterval: 0.18, knockback: 330, invuln: 0.9 },
  DASH:   { speed: 520, duration: 0.17, cooldown: 0.85, invuln: 0.28 },
  REACTION: { vaporize: 1.5, auraDuration: 6 },
  ENERGY: { perSwordHit: 4, perSkillHit: 6, perKill: 3, perDamageTaken: 0.0 },

  // XP needed from level L to L+1 = base + growth * (L-1)^1.4
  XP: { base: 40, growth: 28, exponent: 1.4, maxLevel: 30, perKillMul: 1 },
  LOOT: {
    coinPerKill: [3, 6], potionDropChance: 0.12, bossPotionDrops: 2, potionHeal: 45, interactRange: 64,
    startPotions: 1, maxPotions: 9, magnetRange: 80, pickupRange: 18, pickupLife: 25,
    chests: [ // per level, per chest index
      [{ coins: 25, gems: 10, potions: 1 }, { coins: 30, gems: 10, potions: 1 }, { coins: 40, gems: 20, potions: 1 }],
      [{ coins: 60, gems: 20, potions: 1 }, { coins: 80, gems: 30, potions: 2 }]
    ]
  },
  ENEMY: {
    slime: { hp: 38, speed: 62, dmg: 9, r: 14, xp: 12, aggro: 220, windup: 0.55, leapSpeed: 280, leapTime: 0.28,
             recover: 0.7, attackRange: 80, kbResist: 0, contactDmgMul: 0.6, attackCd: 1.2 }
  },
  BOSS: {
    mitachurl: { name: 'Mitachurl', hp: 520, speed: 70, r: 30, xp: 140, coins: 80, kbResist: 0.85, aggro: 340,
                 melee: { dmg: 22, range: 95, arc: 1.5, windup: 0.8, recover: 0.8 },
                 charge: { dmg: 28, windup: 1.0, speed: 420, dur: 0.6, recover: 1.0, width: 60 },
                 slam: { dmg: 30, radius: 120, windup: 1.1, recover: 1.1 }, cd: 1.3 },
    stormdrake: { name: 'Storm Drake', hp: 900, speed: 80, r: 34, xp: 300, coins: 150, kbResist: 0.9, aggro: 420,
                 projectile: { dmg: 14, speed: 250, count: 5, spread: 0.9, windup: 0.7, recover: 0.8, r: 9, life: 3 },
                 sweep: { dmg: 24, range: 200, arc: 1.2, windup: 1.0, sweepTime: 0.9, recover: 0.9 },
                 aoe: { dmg: 26, radius: 85, count: 4, windup: 1.2, recover: 1.0, range: 260 }, cd: 1.0 }
  },
  LEVELS: [
    { name: 'Mondstadt Fields', w: 2000, h: 1500, regular: 10, enemySpeedMul: 1.0, enemyDmgMul: 1.0, enemyHpMul: 1.0,
      objective: 'Defeat all slimes and the Mitachurl' },
    { name: 'Stormterror Ruins', w: 2200, h: 1600, regular: 15, enemySpeedMul: 1.35, enemyDmgMul: 1.5, enemyHpMul: 1.4,
      objective: 'Defeat all enemies and the Storm Drake' }
  ],
  FLOW: { deathDelay: 0.8, completeDelay: 0.5 },
  SEED: 1337,
  CAMERA: { follow: 8 },
  LIMITS: { particles: 600, projectiles: 60, pickups: 80, damageNumbers: 40, afterimages: 8 },
  CINEMATIC: { duration: 15, narration: 'Awaken, traveller. The winds have brought you to a world in need. Your journey begins now.' }
};

// ---- event bus ----
AT.events = (function () {
  const map = {};
  return {
    on(n, f) { (map[n] = map[n] || []).push(f); },
    off(n, f) { const a = map[n]; if (a) { const i = a.indexOf(f); if (i >= 0) a.splice(i, 1); } },
    emit(n, p) { const a = map[n]; if (!a) return; for (const f of a.slice()) { try { f(p); } catch (e) { if (typeof console !== 'undefined') console.error('[event ' + n + ']', e); } } },
    clear() { for (const k in map) delete map[k]; }
  };
})();

// ---- helpers ----
AT._id = 0;
AT.nextId = function () { return ++AT._id; };
AT.rng = function (seed) { // mulberry32
  let a = (seed >>> 0) || 1;
  const f = function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  f.range = (lo, hi) => lo + (hi - lo) * f();
  f.int = (lo, hi) => Math.floor(lo + (hi - lo + 1) * f());
  return f;
};
AT.clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
AT.lerp = (a, b, t) => a + (b - a) * t;

/* ==== collision.js ==== */
// Aether's Trial — collision helpers (pure logic, no DOM). Owner: combat subagent.
(function () {
  const AT = globalThis.AT;
  const TAU = Math.PI * 2;

  function dist(ax, ay, bx, by) {
    if (ax && typeof ax === 'object') { by = ay && ay.y; bx = ay && ay.x; ay = ax.y; ax = ax.x; }
    return Math.hypot(bx - ax, by - ay);
  }
  function angleTo(ax, ay, bx, by) {
    if (ax && typeof ax === 'object') { by = ay && ay.y; bx = ay && ay.x; ay = ax.y; ax = ax.x; }
    return Math.atan2(by - ay, bx - ax);
  }
  function normalizeAngle(a) {
    a = a % TAU;
    if (a > Math.PI) a -= TAU;
    else if (a < -Math.PI) a += TAU;
    return a;
  }
  function circleCircle(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, rr = (a.r || 0) + (b.r || 0);
    return dx * dx + dy * dy <= rr * rr;
  }
  // rect = {x,y,w,h} with (x,y) the TOP-LEFT corner.
  function circleRect(cx, cy, r, rect) {
    const nx = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    const ny = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }
  // Circle (px,py,r) versus a cone with apex (ox,oy), facing `angle`, full opening `arc`, length `range`.
  function pointInCone(px, py, r, ox, oy, angle, arc, range) {
    const dx = px - ox, dy = py - oy;
    const d = Math.hypot(dx, dy);
    if (d <= r) return true;
    if (d > range + r) return false;
    const diff = Math.abs(normalizeAngle(Math.atan2(dy, dx) - angle));
    const margin = Math.asin(Math.min(1, r / d)); // angular size of the circle
    return diff <= arc / 2 + margin;
  }
  // Oriented rectangle starting at (ox,oy) extending `len` along `angle`, `w` wide (centered on the axis).
  function circleInRectOriented(cx, cy, r, ox, oy, angle, len, w) {
    const c = Math.cos(angle), s = Math.sin(angle);
    const dx = cx - ox, dy = cy - oy;
    const lx = dx * c + dy * s;
    const ly = -dx * s + dy * c;
    const nx = Math.max(0, Math.min(lx, len));
    const ny = Math.max(-w / 2, Math.min(ly, w / 2));
    const ex = lx - nx, ey = ly - ny;
    return ex * ex + ey * ey <= r * r;
  }
  function isSolid(o) { return o && o.solid !== false; }

  function resolveCircleVsObstacles(ent, obstacles) {
    if (!ent || !obstacles) return false;
    let moved = false;
    const r = ent.r || 0;
    for (let i = 0; i < obstacles.length; i++) {
      const o = obstacles[i];
      if (!isSolid(o)) continue;
      if (o.type === 'circle') {
        const dx = ent.x - o.x, dy = ent.y - o.y;
        const d = Math.hypot(dx, dy), min = r + o.r;
        if (d < min) {
          if (d < 1e-6) { ent.x = o.x + min; }
          else { ent.x = o.x + dx / d * min; ent.y = o.y + dy / d * min; }
          moved = true;
        }
      } else {
        const nx = Math.max(o.x, Math.min(ent.x, o.x + o.w));
        const ny = Math.max(o.y, Math.min(ent.y, o.y + o.h));
        let dx = ent.x - nx, dy = ent.y - ny;
        const d2 = dx * dx + dy * dy;
        if (d2 > r * r) continue;
        if (d2 > 1e-9) {
          const d = Math.sqrt(d2);
          ent.x = nx + dx / d * r; ent.y = ny + dy / d * r;
        } else { // center inside the rect: push out through the nearest side
          const l = ent.x - o.x, rt = o.x + o.w - ent.x, t = ent.y - o.y, b = o.y + o.h - ent.y;
          const m = Math.min(l, rt, t, b);
          if (m === l) ent.x = o.x - r;
          else if (m === rt) ent.x = o.x + o.w + r;
          else if (m === t) ent.y = o.y - r;
          else ent.y = o.y + o.h + r;
        }
        moved = true;
      }
    }
    return moved;
  }

  // world: {w,h} or {bounds:{x,y,w,h}}. Returns true if the entity was moved.
  function clampToWorld(ent, world) {
    if (!ent || !world) return false;
    const b = world.bounds || { x: 0, y: 0, w: world.w, h: world.h };
    if (!(b.w > 0) || !(b.h > 0)) return false;
    const r = ent.r || 0;
    const ox = ent.x, oy = ent.y;
    ent.x = Math.max(b.x + r, Math.min(ent.x, b.x + b.w - r));
    ent.y = Math.max(b.y + r, Math.min(ent.y, b.y + b.h - r));
    return ent.x !== ox || ent.y !== oy;
  }

  // Segment (x1,y1)-(x2,y2), thickened by r, versus solid obstacles. Returns boolean.
  function segmentHitsObstacle(x1, y1, x2, y2, obstacles, r) {
    r = r || 0;
    if (!obstacles) return false;
    const sx = x2 - x1, sy = y2 - y1;
    for (let i = 0; i < obstacles.length; i++) {
      const o = obstacles[i];
      if (!isSolid(o)) continue;
      if (o.type === 'circle') {
        const l2 = sx * sx + sy * sy;
        let t = l2 > 0 ? ((o.x - x1) * sx + (o.y - y1) * sy) / l2 : 0;
        t = Math.max(0, Math.min(1, t));
        if (Math.hypot(x1 + sx * t - o.x, y1 + sy * t - o.y) <= o.r + r) return true;
      } else {
        // slab test against the rect expanded by r
        const minX = o.x - r, maxX = o.x + o.w + r, minY = o.y - r, maxY = o.y + o.h + r;
        let t0 = 0, t1 = 1, ok = true;
        const p = [-sx, sx, -sy, sy];
        const q = [x1 - minX, maxX - x1, y1 - minY, maxY - y1];
        for (let k = 0; k < 4; k++) {
          if (p[k] === 0) { if (q[k] < 0) { ok = false; break; } }
          else {
            const t = q[k] / p[k];
            if (p[k] < 0) { if (t > t1) { ok = false; break; } if (t > t0) t0 = t; }
            else { if (t < t0) { ok = false; break; } if (t < t1) t1 = t; }
          }
        }
        if (ok) return true;
      }
    }
    return false;
  }

  AT.Collision = {
    dist, angleTo, normalizeAngle, circleCircle, circleRect, pointInCone,
    circleInRectOriented, resolveCircleVsObstacles, clampToWorld, segmentHitsObstacle
  };
})();

/* ==== elements.js ==== */
// Aether's Trial — elemental aura + reaction logic (pure logic, no DOM). Owner: combat subagent.
(function () {
  const AT = globalThis.AT;
  const AURAS = { hydro: true, pyro: true };

  function vaporizeMul() {
    const r = AT.CFG && AT.CFG.REACTION;
    return (r && r.vaporize) || 1.5;
  }
  function auraDur() {
    const r = AT.CFG && AT.CFG.REACTION;
    return (r && r.auraDuration) || 6;
  }

  // Physical (and non pyro/hydro) elements never apply an aura.
  function applyElement(enemy, element, gaugeUnits) {
    if (!enemy || !AURAS[element]) return;
    enemy.aura = { element: element, t: gaugeUnits > 0 ? gaugeUnits : auraDur() };
  }

  function tick(enemy, dt) {
    if (!enemy || !enemy.aura) return;
    enemy.aura.t -= dt;
    if (enemy.aura.t <= 0) enemy.aura = null;
  }

  function isHydroAffected(enemy) {
    return !!enemy && (enemy.element === 'hydro' || (!!enemy.aura && enemy.aura.element === 'hydro'));
  }

  // Resolves one hit: may consume/apply auras. Returns {damage, reaction, multiplier, consumedAura}.
  function resolve(enemy, element, baseDamage) {
    const res = { damage: baseDamage, reaction: null, multiplier: 1, consumedAura: false };
    if (!enemy || element === 'physical' || element === 'none' || !element) return res;
    if (element === 'pyro' && isHydroAffected(enemy)) {
      res.reaction = 'vaporize';
      res.multiplier = vaporizeMul();
      res.damage = baseDamage * res.multiplier;
      if (enemy.aura && enemy.aura.element === 'hydro') { enemy.aura = null; res.consumedAura = true; }
      return res;
    }
    applyElement(enemy, element);
    return res;
  }

  AT.Elements = { applyElement, tick, resolve, isHydroAffected };
})();

/* ==== projectiles.js ==== */
// Aether's Trial — projectiles (pure logic, no DOM). Owner: combat subagent.
(function () {
  const AT = globalThis.AT;
  const PASS_THROUGH = { water: true, void: true }; // visuals that don't block projectiles

  const P = {
    list: [],

    spawn(def) {
      def = def || {};
      const cap = (AT.CFG.LIMITS && AT.CFG.LIMITS.projectiles) || 60;
      const p = {
        kind: 'projectile',
        owner: def.owner || 'enemy',
        element: def.element || 'none',
        x: def.x || 0, y: def.y || 0,
        vx: def.vx || 0, vy: def.vy || 0,
        r: def.r || 8,
        dmg: def.dmg || 0,
        life: def.life > 0 ? def.life : 2,
        pierce: !!def.pierce,
        hitIds: {},
        dead: false,
        hitId: def.hitId || AT.nextId(),
        color: def.color || null,
        knockback: def.knockback || 0
      };
      if (def.id) p.id = def.id;
      while (P.list.length >= cap) P.list.shift(); // drop oldest
      P.list.push(p);
      return p;
    },

    // ctx = {enemies, player, world}
    update(dt, ctx) {
      ctx = ctx || {};
      const player = ctx.player || AT.player;
      const enemies = ctx.enemies || [];
      const world = ctx.world;
      const C = AT.Collision;
      for (let i = 0; i < P.list.length; i++) {
        const p = P.list[i];
        if (p.dead) continue;
        const ox = p.x, oy = p.y;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) { p.dead = true; continue; }
        if (world && world.w > 0 && (p.x < -50 || p.y < -50 || p.x > world.w + 50 || p.y > world.h + 50)) { p.dead = true; continue; }
        if (world && world.obstacles) {
          const blockers = world.obstacles.filter(o => o.solid !== false && !PASS_THROUGH[o.visual]);
          if (blockers.length && C.segmentHitsObstacle(ox, oy, p.x, p.y, blockers, p.r * 0.5)) { p.dead = true; continue; }
        }
        if (p.owner === 'player') {
          for (let j = 0; j < enemies.length; j++) {
            const e = enemies[j];
            if (!e || e.dead || e.hp <= 0) continue;
            if (p.hitIds[e.id !== undefined ? e.id : j]) continue;
            if (!C.circleCircle(p, e)) continue;
            p.hitIds[e.id !== undefined ? e.id : j] = true;
            const sp = Math.hypot(p.vx, p.vy) || 1;
            AT.Combat.dealDamageToEnemy(e, {
              amount: p.dmg, element: p.element, source: 'player', hitId: p.hitId,
              knockback: p.knockback ? { x: p.vx / sp * p.knockback, y: p.vy / sp * p.knockback } : null,
              kind: 'projectile'
            });
            if (!p.pierce) { p.dead = true; break; }
          }
        } else if (player && !player.dead && !(player.invuln > 0)) {
          if (!p.hitIds.player && C.circleCircle(p, player)) {
            p.hitIds.player = true;
            AT.Combat.damagePlayer(player, p.dmg, { x: p.x, y: p.y, element: p.element, source: 'projectile' });
            if (!p.pierce) p.dead = true;
          }
        }
      }
      let w = 0;
      for (let i = 0; i < P.list.length; i++) if (!P.list[i].dead) P.list[w++] = P.list[i];
      P.list.length = w;
    },

    clear() { P.list.length = 0; }
  };

  AT.Projectiles = P;
})();

/* ==== combat.js ==== */
// Aether's Trial — combat: sword, Pyro skill, elemental burst, damage paths (pure logic, no DOM). Owner: combat subagent.
(function () {
  const AT = globalThis.AT;
  const CFG = () => AT.CFG;
  const emit = (n, p) => AT.events.emit(n, p);

  const state = { swings: [], effects: [], clock: 0, swordReadyAt: 0, skillReadyAt: 0, comboUntil: -1 };
  const activeHitboxes = [];

  function addEnergy(player, n) {
    if (!player || !(n > 0) || player.dead) return;
    const max = player.maxEnergy || CFG().PLAYER.maxEnergy;
    const before = player.energy || 0;
    player.energy = Math.min(max, before + n);
    if (player.energy !== before) emit('energyChanged', {});
  }

  function resistOf(enemy) {
    const c = CFG();
    if (enemy.kind === 'boss') {
      const b = c.BOSS && c.BOSS[enemy.id];
      return (b && b.kbResist) || 0;
    }
    const e = c.ENEMY && c.ENEMY[enemy.type];
    return (e && e.kbResist) || 0;
  }

  // The ONE path through which enemies take damage.
  // opts: {amount, element, source, hitId, knockback:{x,y} | {dir,force}, dir, force, heavy, kind:'sword'|'skill'|'burst'|'projectile', energy}
  function dealDamageToEnemy(enemy, opts) {
    if (!enemy || !opts) return null;
    if (enemy.dead || enemy.state === 'dead' || !(enemy.hp > 0)) return null;
    if (!(opts.amount > 0)) return null;
    if (opts.hitId !== undefined && opts.hitId !== null) {
      enemy.hitIds = enemy.hitIds || {};
      if (enemy.hitIds[opts.hitId]) return null;
      enemy.hitIds[opts.hitId] = true;
    }
    const element = opts.element || 'physical';
    const source = opts.source || 'player';
    const res = AT.Elements.resolve(enemy, element, opts.amount);
    const dmg = res.damage;
    enemy.hp = Math.max(0, enemy.hp - dmg);
    enemy.hitFlash = 0.12;

    // knockback
    let kx = 0, ky = 0;
    const kb = opts.knockback;
    if (kb && kb.x !== undefined) { kx = kb.x; ky = kb.y; }
    else {
      const dir = kb && kb.dir !== undefined ? kb.dir : opts.dir;
      const force = kb && kb.force !== undefined ? kb.force : opts.force;
      if (dir !== undefined && force) { kx = Math.cos(dir) * force; ky = Math.sin(dir) * force; }
    }
    if (kx || ky) {
      const k = 1 - Math.min(1, Math.max(0, resistOf(enemy)));
      enemy.kb = enemy.kb || { x: 0, y: 0 };
      enemy.kb.x += kx * k; enemy.kb.y += ky * k;
    }

    const killed = enemy.hp <= 0;
    if (killed) { enemy.dead = true; enemy.state = 'dead'; enemy.vx = 0; enemy.vy = 0; }

    emit('damage', { target: enemy, source: source, amount: dmg, element: element, reaction: res.reaction,
      crit: false, x: enemy.x, y: enemy.y, killed: killed });
    if (res.reaction) emit('reaction', { name: res.reaction, x: enemy.x, y: enemy.y, multiplier: res.multiplier });
    emit('hit', { x: enemy.x, y: enemy.y, element: element, reaction: res.reaction, heavy: !!opts.heavy });

    if (source === 'player') {
      const player = opts.player || AT.player;
      const e = CFG().ENERGY || {};
      let gain = opts.energy;
      if (gain === undefined) gain = opts.kind === 'sword' ? e.perSwordHit : opts.kind === 'skill' ? e.perSkillHit : 0;
      if (killed) gain = (gain || 0) + (e.perKill || 0);
      addEnergy(player, gain);
    }
    if (killed) {
      if (!enemy._killEmitted) {
        enemy._killEmitted = true;
        emit('enemyKilled', { enemy: enemy, x: enemy.x, y: enemy.y, byPlayer: true });
      }
      if (enemy.kind === 'boss' && !enemy._bossEmitted) {
        enemy._bossEmitted = true;
        emit('bossDefeated', { boss: enemy, id: enemy.id });
      }
    }
    return { damage: dmg, reaction: res.reaction, multiplier: res.multiplier, killed: killed };
  }

  // src: {x, y, element, source, knockback}
  function damagePlayer(player, amount, src) {
    if (!player || player.dead || player.hp <= 0) return false;
    if (player.invuln > 0) return false;
    if (!(amount > 0)) return false;
    src = src || {};
    const c = CFG();
    const dmg = Math.max(1, Math.round(amount));
    player.hp = Math.max(0, player.hp - dmg);
    player.invuln = c.PLAYER.invulnAfterHit;
    player.hitFlash = 0.15;
    if (src.x !== undefined && src.y !== undefined) {
      const a = Math.atan2(player.y - src.y, player.x - src.x);
      const f = src.knockback !== undefined ? src.knockback : c.PLAYER.hurtKnock;
      player.kb = player.kb || { x: 0, y: 0 };
      player.kb.x = Math.cos(a) * f; player.kb.y = Math.sin(a) * f;
    }
    if (c.ENERGY.perDamageTaken) addEnergy(player, dmg * c.ENERGY.perDamageTaken);
    const died = player.hp <= 0;
    emit('damage', { target: player, source: src.source || 'enemy', amount: dmg, element: src.element || 'physical',
      reaction: null, crit: false, x: player.x, y: player.y, killed: died });
    emit('playerHurt', { amount: dmg, x: player.x, y: player.y });
    emit('hpChanged', {});
    if (died) {
      player.dead = true;
      player.anim = 'dead';
      if (!player._deathEmitted) { player._deathEmitted = true; emit('playerDied', {}); }
    } else {
      player.anim = 'hurt';
    }
    return true;
  }

  function ready(player) { return player && !player.dead && !(player.hp <= 0); }

  function playerSword(player, ctx) {
    if (!ready(player)) return false;
    const c = CFG().SWORD;
    if (state.clock < state.swordReadyAt) return false;
    const combo = state.clock <= state.comboUntil ? ((player.combo || 0) + 1) % c.comboMul.length : 0;
    const hitId = AT.nextId();
    const angle = player.facing || 0;
    state.swordReadyAt = state.clock + c.cooldown;
    state.comboUntil = state.clock + c.comboWindow;
    player.atkCd = c.cooldown;
    player.combo = combo;
    player.swinging = c.duration;
    player.swingAngle = angle;
    player.swingId = hitId;
    state.swings.push({ type: 'sword', hitId: hitId, t: 0, dur: c.duration, hitDelay: c.hitDelay, angle: angle,
      range: c.range, arc: c.arc, mul: c.damageMul * (c.comboMul[combo] || 1), combo: combo,
      heavy: combo === c.comboMul.length - 1, element: 'physical', kb: c.knockback });
    emit('swordSwing', { x: player.x, y: player.y, angle: angle });
    return true;
  }

  function playerSkill(player, ctx) {
    if (!ready(player)) return false;
    const c = CFG().SKILL;
    if (state.clock < state.skillReadyAt) return false;
    const hitId = AT.nextId();
    const angle = player.facing || 0;
    state.skillReadyAt = state.clock + c.cooldown;
    player.skillCd = c.cooldown;
    state.swings.push({ type: 'skill', hitId: hitId, t: 0, dur: c.duration, hitDelay: c.hitDelay, angle: angle,
      range: c.range, arc: c.arc, mul: c.damageMul, heavy: true, element: 'pyro', kb: c.knockback });
    // fireball particle descriptors for fx (renderer/particles may read these)
    for (let i = 0; i < 7; i++) {
      const a = angle + (i / 6 - 0.5) * c.arc;
      state.effects.push({ type: 'fireball', x: player.x, y: player.y, angle: a, speed: c.range / c.duration * (0.6 + 0.4 * (i % 3) / 2),
        t: 0, dur: c.duration, element: 'pyro' });
    }
    addEnergy(player, c.energyGain);
    emit('skillCast', { x: player.x, y: player.y, angle: angle });
    return true;
  }

  function playerBurst(player, ctx) {
    if (!ready(player)) return false;
    const c = CFG().BURST;
    if ((player.energy || 0) < c.cost) return false;
    const hitBase = AT.nextId();
    player.energy = 0;
    emit('energyChanged', {});
    player.invuln = Math.max(player.invuln || 0, c.invuln);
    state.swings.push({ type: 'burst', t: 0, dur: c.ticks * c.tickInterval, ticks: c.ticks, tickIndex: 0,
      interval: c.tickInterval, radius: c.radius, mulPerTick: c.damageMul / c.ticks, hitBase: hitBase,
      element: 'pyro', kb: c.knockback });
    state.effects.push({ type: 'burst', x: player.x, y: player.y, r: c.radius, t: 0, dur: c.ticks * c.tickInterval + 0.35, element: 'pyro' });
    emit('burstCast', { x: player.x, y: player.y });
    return true;
  }

  function hitCone(s, player, enemies) {
    const C = AT.Collision;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e || e.dead) continue;
      if (!C.pointInCone(e.x, e.y, e.r || 0, player.x, player.y, s.angle, s.arc, s.range)) continue;
      const a = Math.atan2(e.y - player.y, e.x - player.x);
      dealDamageToEnemy(e, { amount: player.atk * s.mul, element: s.element, source: 'player', hitId: s.hitId,
        knockback: { dir: a, force: s.kb }, heavy: s.heavy, kind: s.type, player: player });
    }
  }

  function update(dt, ctx) {
    ctx = ctx || {};
    const enemies = ctx.enemies || [];
    const player = ctx.player || AT.player;
    state.clock += dt;
    activeHitboxes.length = 0;

    if (player) {
      player.atkCd = Math.max(0, state.swordReadyAt - state.clock);
      player.skillCd = Math.max(0, state.skillReadyAt - state.clock);
    }
    for (let i = 0; i < enemies.length; i++) AT.Elements.tick(enemies[i], dt);

    const dead = !player || player.dead;
    for (let i = 0; i < state.swings.length; i++) {
      const s = state.swings[i];
      s.t += dt;
      if (dead) { s.done = true; continue; }
      if (s.type === 'burst') {
        while (s.tickIndex < s.ticks && s.t >= s.tickIndex * s.interval) {
          const id = s.hitBase + ':' + s.tickIndex;
          s.tickIndex++;
          const C = AT.Collision;
          for (let j = 0; j < enemies.length; j++) {
            const e = enemies[j];
            if (!e || e.dead) continue;
            if (!C.circleCircle({ x: player.x, y: player.y, r: s.radius }, e)) continue;
            const a = Math.atan2(e.y - player.y, e.x - player.x);
            dealDamageToEnemy(e, { amount: player.atk * s.mulPerTick, element: 'pyro', source: 'player', hitId: id,
              knockback: { dir: a, force: s.kb }, heavy: true, kind: 'burst', energy: 0, player: player });
          }
        }
        activeHitboxes.push({ shape: 'circle', x: player.x, y: player.y, r: s.radius, range: s.radius, angle: 0, arc: Math.PI * 2,
          t: s.t, dur: s.dur, element: 'pyro' });
      } else {
        if (s.t >= s.hitDelay) hitCone(s, player, enemies); // hitIds prevent repeats across the window
        activeHitboxes.push({ shape: 'cone', x: player.x, y: player.y, r: s.range, angle: s.angle, arc: s.arc, range: s.range,
          t: s.t, dur: s.dur, element: s.element, combo: s.combo, type: s.type });
      }
      if (s.t >= s.dur) s.done = true;
    }
    state.swings = state.swings.filter(s => !s.done);

    for (let i = 0; i < state.effects.length; i++) state.effects[i].t += dt;
    state.effects = state.effects.filter(f => f.t < f.dur);
  }

  function reset() {
    state.swings = []; state.effects = []; state.clock = 0;
    state.swordReadyAt = 0; state.skillReadyAt = 0; state.comboUntil = -1;
    activeHitboxes.length = 0;
  }

  AT.Combat = { state, activeHitboxes, dealDamageToEnemy, damagePlayer, playerSword, playerSkill, playerBurst, update, reset, addEnergy };
})();

/* ==== world.js ==== */
// Aether's Trial — world geometry (obstacles, decor, spawn queries). Pure logic, no DOM.
(function () {
  const AT = globalThis.AT;

  // Push a circle entity out of a single obstacle. Returns true if moved.
  function pushOut(ent, o) {
    const r = ent.r || 0;
    if (o.type === 'circle') {
      let dx = ent.x - o.x, dy = ent.y - o.y;
      let d = Math.sqrt(dx * dx + dy * dy);
      const min = o.r + r;
      if (d >= min) return false;
      if (d < 1e-6) { dx = 1; dy = 0; d = 1; }
      ent.x = o.x + (dx / d) * min;
      ent.y = o.y + (dy / d) * min;
      return true;
    }
    const cx = Math.max(o.x, Math.min(ent.x, o.x + o.w));
    const cy = Math.max(o.y, Math.min(ent.y, o.y + o.h));
    let dx = ent.x - cx, dy = ent.y - cy;
    const d2 = dx * dx + dy * dy;
    if (d2 >= r * r) return false;
    if (d2 > 1e-9) {
      const d = Math.sqrt(d2);
      ent.x = cx + (dx / d) * r;
      ent.y = cy + (dy / d) * r;
      return true;
    }
    // centre inside rect: exit by the shortest side
    const l = ent.x - o.x, rt = o.x + o.w - ent.x, t = ent.y - o.y, b = o.y + o.h - ent.y;
    const m = Math.min(l, rt, t, b);
    if (m === l) ent.x = o.x - r;
    else if (m === rt) ent.x = o.x + o.w + r;
    else if (m === t) ent.y = o.y - r;
    else ent.y = o.y + o.h + r;
    return true;
  }

  function hitsObstacle(x, y, r, o) {
    if (o.type === 'circle') {
      const dx = x - o.x, dy = y - o.y, m = o.r + r;
      return dx * dx + dy * dy < m * m;
    }
    const cx = Math.max(o.x, Math.min(x, o.x + o.w));
    const cy = Math.max(o.y, Math.min(y, o.y + o.h));
    const dx = x - cx, dy = y - cy;
    return dx * dx + dy * dy < r * r || (x > o.x && x < o.x + o.w && y > o.y && y < o.y + o.h);
  }

  const World = {
    pushOut, hitsObstacle,

    // def: {index,name,w,h,theme,obstacles[],decor[],water[],playerStart,spawnPoints}
    create(def) {
      def = def || {};
      const w = def.w || 2000, h = def.h || 1500;
      const world = {
        index: def.index || 0,
        name: def.name || '',
        w, h,
        theme: def.theme || 'fields',
        obstacles: (def.obstacles || []).map(o => Object.assign({ solid: true }, o)),
        decor: (def.decor || []).slice(),
        water: (def.water || []).slice(),
        playerStart: Object.assign({ x: 150, y: h - 150 }, def.playerStart || {}),
        spawnPoints: def.spawnPoints || {},
        bounds: { x: 0, y: 0, w, h },
        isBlocked(x, y, r) {
          r = r || 0;
          if (x < r || y < r || x > w - r || y > h - r) return true;
          const obs = world.obstacles;
          for (let i = 0; i < obs.length; i++) {
            const o = obs[i];
            if (o.solid !== false && hitsObstacle(x, y, r, o)) return true;
          }
          return false;
        },
        randomOpenPoint(rng, r) {
          r = r || 14;
          const rnd = typeof rng === 'function' ? rng : Math.random;
          const m = r + 40;
          for (let i = 0; i < 400; i++) {
            const x = m + rnd() * (w - 2 * m), y = m + rnd() * (h - 2 * m);
            if (!world.isBlocked(x, y, r)) return { x, y };
          }
          return world.findOpenNear(world.playerStart.x, world.playerStart.y, r);
        },
        // Spiral search for the nearest open spot to (x,y).
        findOpenNear(x, y, r) {
          r = r || 14;
          if (!world.isBlocked(x, y, r)) return { x, y };
          for (let rad = 12; rad < 800; rad += 12) {
            const steps = Math.max(8, Math.floor(rad / 6));
            for (let k = 0; k < steps; k++) {
              const a = (k / steps) * Math.PI * 2;
              const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
              if (!world.isBlocked(px, py, r)) return { x: px, y: py };
            }
          }
          return { x, y };
        },
        resolveEntity(ent) {
          let moved = false;
          for (let pass = 0; pass < 2; pass++) {
            for (let i = 0; i < world.obstacles.length; i++) {
              const o = world.obstacles[i];
              if (o.solid !== false && pushOut(ent, o)) moved = true;
            }
          }
          return moved;
        },
        clampEntity(ent) {
          const r = ent.r || 0;
          ent.x = Math.max(r, Math.min(w - r, ent.x));
          ent.y = Math.max(r, Math.min(h - r, ent.y));
        }
      };
      return world;
    }
  };

  AT.World = World;
})();

/* ==== enemies.js ==== */
// Aether's Trial — regular enemies (slimes). Pure logic, no DOM.
// Telegraph convention (enemies and bosses): t = seconds ELAPSED since telegraph start, dur = total; progress = t/dur.
// enemy.deathT = seconds elapsed since death (removed by Levels once >= CFG.ENEMY.deathDur || 0.8).
(function () {
  const AT = globalThis.AT;
  const TAU = Math.PI * 2;

  function playerAlive(p) { return !!p && !p.dead && !(p.hp <= 0) && p.anim !== 'dead'; }
  function hurt(player, amount, e, element) {
    if (AT.Combat && AT.Combat.damagePlayer) {
      AT.Combat.damagePlayer(player, amount, { x: e.x, y: e.y, source: e, element: element || e.element });
    }
  }
  function sethome(e) { e.home = { x: e.x, y: e.y }; }

  const Enemies = {
    // opts: {behavior:'normal'|'lunger'|'shooter', rng}
    create(type, element, x, y, levelIndex, opts) {
      type = type || 'slime';
      opts = opts || {};
      const c = AT.CFG.ENEMY[type] || AT.CFG.ENEMY.slime;
      const L = (AT.CFG.LEVELS && AT.CFG.LEVELS[levelIndex || 0]) || {};
      const sm = L.enemySpeedMul || 1, dm = L.enemyDmgMul || 1, hm = L.enemyHpMul || 1;
      const behavior = opts.behavior || 'normal';
      const lunger = behavior === 'lunger', shooter = behavior === 'shooter';
      const id = AT.nextId();
      const e = {
        id, kind: 'enemy', type, element: element || 'hydro', behavior, levelIndex: levelIndex || 0,
        x, y, vx: 0, vy: 0, r: c.r,
        hp: Math.round(c.hp * hm * (shooter ? 0.8 : 1)), maxHp: 0,
        dead: false, facing: 0, hitFlash: 0, kb: { x: 0, y: 0 },
        aura: null, state: 'idle', stateT: 0, telegraph: null,
        dmg: c.dmg * dm * (lunger ? 1.1 : 1), speed: c.speed * sm * (lunger ? 1.15 : shooter ? 0.85 : 1),
        xp: c.xp * (1 + 0.4 * (levelIndex || 0)), coins: 0, rewardGiven: false, hitIds: {},
        deathT: 0, atkCd: 0.6 + (id % 5) * 0.2,
        aggro: shooter ? c.aggro * 1.4 : c.aggro,
        // slime attack tuning
        windup: lunger ? 0.48 : Math.max(0.5, c.windup), // always >= 0.45s visible
        recover: lunger ? c.recover * 0.6 : shooter ? c.recover * 1.6 : c.recover,
        leapSpeed: c.leapSpeed * sm * (lunger ? 1.3 : 1), leapTime: c.leapTime,
        attackRange: c.attackRange * (lunger ? 1.2 : 1),
        shootRange: 330, keepDist: 220,
        wanderT: 0, wanderA: 0, wanderMove: false,
        dirX: 1, dirY: 0, leapHit: false, fired: false,
        rng: opts.rng || AT.rng(id * 7919 + 13)
      };
      e.maxHp = e.hp;
      e.facing = e.rng() * TAU;
      sethome(e);
      return e;
    },

    update(e, dt, ctx) {
      if (!e) return;
      if (e.dead) { // dead enemies do nothing but run the death clock
        e.state = 'dead'; e.telegraph = null; e.vx = 0; e.vy = 0;
        e.deathT += dt;
        return;
      }
      if (AT.Elements && AT.Elements.tick) AT.Elements.tick(e, dt);
      const c = AT.CFG.ENEMY[e.type] || AT.CFG.ENEMY.slime;
      const player = ctx && ctx.player;
      const alive = playerAlive(player);
      e.hitFlash = Math.max(0, e.hitFlash - dt);
      e.atkCd = Math.max(0, e.atkCd - dt);
      e.stateT += dt;

      // knockback
      if (e.kb && (e.kb.x || e.kb.y)) {
        e.x += e.kb.x * dt; e.y += e.kb.y * dt;
        const k = Math.exp(-9 * dt);
        e.kb.x *= k; e.kb.y *= k;
        if (Math.abs(e.kb.x) < 2 && Math.abs(e.kb.y) < 2) { e.kb.x = 0; e.kb.y = 0; }
      }

      const dx = alive ? player.x - e.x : 0, dy = alive ? player.y - e.y : 0;
      const d = alive ? Math.sqrt(dx * dx + dy * dy) : Infinity;
      const toP = alive ? Math.atan2(dy, dx) : e.facing;
      e.vx = 0; e.vy = 0;
      const shooter = e.behavior === 'shooter';
      const leapDist = e.leapSpeed * e.leapTime;

      // contact damage (cooldown-gated); never during windup so telegraphs stay honest
      if (alive && e.state !== 'windup' && e.atkCd <= 0 && d < e.r + player.r) {
        hurt(player, e.dmg * (c.contactDmgMul || 0.6), e);
        e.atkCd = c.attackCd || 1.2;
      }

      const setState = (s) => { e.state = s; e.stateT = 0; };

      if (!alive && (e.state === 'windup' || e.state === 'attack' || e.state === 'chase')) {
        e.telegraph = null; setState('wander');
      }

      switch (e.state) {
        case 'idle':
        case 'wander': {
          if (alive && d < e.aggro) { setState('chase'); break; }
          e.wanderT -= dt;
          if (e.wanderT <= 0) {
            e.wanderT = 1 + e.rng() * 1.8;
            e.wanderMove = e.rng() < 0.6;
            // drift back toward home if strayed far
            const hx = e.home.x - e.x, hy = e.home.y - e.y;
            e.wanderA = Math.hypot(hx, hy) > 220 ? Math.atan2(hy, hx) : e.rng() * TAU;
          }
          if (e.wanderMove) {
            e.vx = Math.cos(e.wanderA) * e.speed * 0.45; e.vy = Math.sin(e.wanderA) * e.speed * 0.45;
            e.facing = e.wanderA;
          }
          e.state = e.wanderMove ? 'wander' : 'idle';
          break;
        }
        case 'chase': {
          if (!alive || d > e.aggro * 1.6) { setState('wander'); break; }
          e.facing = toP;
          if (shooter) {
            if (d > e.keepDist + 30) { e.vx = Math.cos(toP) * e.speed; e.vy = Math.sin(toP) * e.speed; }
            else if (d < e.keepDist - 50) { e.vx = -Math.cos(toP) * e.speed; e.vy = -Math.sin(toP) * e.speed; }
            if (e.atkCd <= 0 && d < e.shootRange && e.stateT > 0.3) { setState('windup'); e.fired = false; e.dirX = Math.cos(toP); e.dirY = Math.sin(toP); }
          } else {
            e.vx = Math.cos(toP) * e.speed; e.vy = Math.sin(toP) * e.speed;
            if (e.atkCd <= 0 && d < e.attackRange) { setState('windup'); e.leapHit = false; e.dirX = Math.cos(toP); e.dirY = Math.sin(toP); }
          }
          if (e.state === 'windup' && AT.events) AT.events.emit('telegraph', { kind: shooter ? 'shot' : 'leap', x: e.x, y: e.y });
          break;
        }
        case 'windup': {
          const dur = e.windup;
          // aim tracks the player for the first half, then locks (so it can be dodged)
          if (alive && e.stateT < dur * 0.5) {
            e.dirX = Math.cos(toP); e.dirY = Math.sin(toP);
          }
          e.facing = Math.atan2(e.dirY, e.dirX);
          const t = Math.min(e.stateT, dur);
          if (shooter) e.telegraph = { shape: 'line', x: e.x, y: e.y, angle: e.facing, len: e.shootRange, w: 16, r: 0, t, dur };
          else e.telegraph = { shape: 'circle', x: e.x, y: e.y, r: leapDist + e.r + 4, angle: e.facing, t, dur };
          if (e.stateT >= dur) {
            e.telegraph = null; setState('attack');
            if (shooter) {
              if (AT.Projectiles && AT.Projectiles.spawn) {
                AT.Projectiles.spawn({
                  owner: 'enemy', element: e.element, x: e.x + e.dirX * (e.r + 4), y: e.y + e.dirY * (e.r + 4),
                  vx: e.dirX * 260, vy: e.dirY * 260, r: 7, dmg: e.dmg * 0.85, life: 2.4,
                  pierce: false, hitIds: {}, dead: false, hitId: AT.nextId(), color: e.element === 'anemo' ? '#8ff5d0' : '#c78cff'
                });
              }
              e.fired = true; e.atkCd = (c.attackCd || 1.2) * 1.5;
            }
          }
          break;
        }
        case 'attack': {
          if (shooter) { setState('recover'); break; }
          // leap
          e.vx = e.dirX * e.leapSpeed; e.vy = e.dirY * e.leapSpeed;
          if (alive && !e.leapHit && d < e.r + player.r + 2) {
            e.leapHit = true;
            hurt(player, e.dmg, e);
            e.atkCd = c.attackCd || 1.2;
          }
          if (e.stateT >= e.leapTime) { if (e.atkCd < 0.8) e.atkCd = 0.8; setState('recover'); }
          break;
        }
        case 'recover': {
          if (e.stateT >= e.recover) { setState(alive && d < e.aggro * 1.6 ? 'chase' : 'wander'); }
          break;
        }
        default: setState('idle');
      }

      e.x += e.vx * dt; e.y += e.vy * dt;
    }
  };

  AT.Enemies = Enemies;
})();

/* ==== bosses.js ==== */
// Aether's Trial — bosses (Mitachurl, Storm Drake). Pure logic, no DOM.
// boss.telegraph: single telegraph (t elapsed, dur). For multi-circle AoE it is the first circle and carries
// `circles:[{x,y,r}]`; boss.telegraphs holds the full list (empty array when none).
// Cone telegraphs: {shape:'cone', x,y, r:range, angle, arc, t, dur}. Line: {shape:'line', x,y, angle, len, w}.
(function () {
  const AT = globalThis.AT;
  const TAU = Math.PI * 2;
  const MIN_WINDUP = 0.7;

  function playerAlive(p) { return !!p && !p.dead && !(p.hp <= 0) && p.anim !== 'dead'; }
  function angDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
  function hurt(player, amount, b, element) {
    if (AT.Combat && AT.Combat.damagePlayer) {
      AT.Combat.damagePlayer(player, amount, { x: b.x, y: b.y, source: b, element: element || b.element });
    }
  }
  function inCone(p, ox, oy, angle, arc, range) {
    const dx = p.x - ox, dy = p.y - oy, d = Math.hypot(dx, dy);
    if (d > range + p.r * 0.5) return false;
    if (d < p.r + 4) return true;
    const pad = Math.asin(Math.min(1, p.r * 0.5 / d));
    return Math.abs(angDiff(Math.atan2(dy, dx), angle)) <= arc / 2 + pad;
  }

  const Bosses = {
    create(id, x, y) {
      const c = AT.CFG.BOSS[id];
      if (!c) throw new Error('Unknown boss ' + id);
      const b = {
        id, kind: 'boss', bossId: id, type: id, name: c.name,
        element: id === 'stormdrake' ? 'electro' : 'geo',
        x, y, vx: 0, vy: 0, r: c.r, hp: c.hp, maxHp: c.hp, dead: false, facing: Math.PI / 2,
        hitFlash: 0, kb: { x: 0, y: 0 }, aura: null,
        state: 'idle', stateT: 0, telegraph: null, telegraphs: [],
        dmg: 0, speed: c.speed, xp: c.xp, coins: c.coins, rewardGiven: false, hitIds: {},
        deathT: 0, phase: 1, enraged: false, attackName: '', active: false,
        arena: { x, y, r: 420 }, home: { x, y },
        cd: 1.2, atk: null, atkDur: 0, recDur: 0, hitDone: false, lastAtk: '',
        strafe: 1, strafeT: 2, dashDir: 0, rng: AT.rng(id.length * 104729 + 7)
      };
      return b;
    },

    update(b, dt, ctx) {
      if (!b) return;
      if (b.dead) {
        b.state = 'dead'; b.telegraph = null; b.telegraphs = []; b.attackName = ''; b.vx = 0; b.vy = 0;
        b.deathT += dt;
        return;
      }
      if (AT.Elements && AT.Elements.tick) AT.Elements.tick(b, dt);
      const c = AT.CFG.BOSS[b.id];
      const player = ctx && ctx.player;
      const alive = playerAlive(player);
      b.hitFlash = Math.max(0, b.hitFlash - dt);
      b.stateT += dt;
      b.cd = Math.max(0, b.cd - dt);
      if (b.kb && (b.kb.x || b.kb.y)) {
        b.x += b.kb.x * dt; b.y += b.kb.y * dt;
        const k = Math.exp(-10 * dt);
        b.kb.x *= k; b.kb.y *= k;
        if (Math.abs(b.kb.x) < 2 && Math.abs(b.kb.y) < 2) { b.kb.x = 0; b.kb.y = 0; }
      }
      b.vx = 0; b.vy = 0;

      const dx = alive ? player.x - b.x : 0, dy = alive ? player.y - b.y : 0;
      const d = alive ? Math.hypot(dx, dy) : Infinity;
      const toP = alive ? Math.atan2(dy, dx) : b.facing;

      if (!b.active) {
        if (alive && (d < c.aggro || b.hp < b.maxHp)) { b.active = true; b.state = 'chase'; b.stateT = 0; b.cd = 1.0; }
        else return;
      }

      if (!b.enraged && b.hp <= b.maxHp * 0.5) {
        b.enraged = true; b.phase = 2;
        b.speed *= 1.2;
        b.telegraph = null; b.telegraphs = []; b.attackName = '';
        b.state = 'recover'; b.stateT = 0; b.recDur = 0.9; b.atk = null; b.cd = 0.6;
        if (AT.events) AT.events.emit('bossPhase', { id: b.id, name: b.name });
      }

      if (!alive && b.state !== 'chase' && b.state !== 'idle') { // player died mid-attack: stand down
        b.telegraph = null; b.telegraphs = []; b.attackName = ''; b.atk = null; b.state = 'chase'; b.stateT = 0;
      }

      if (b.id === 'mitachurl') this._mitachurl(b, dt, c, player, alive, d, toP);
      else this._drake(b, dt, c, player, alive, d, toP);

      b.x += b.vx * dt; b.y += b.vy * dt;
    },

    _go(b, name, windup, recover) {
      b.state = 'windup'; b.stateT = 0; b.atk = name; b.attackName = name;
      b.atkDur = Math.max(MIN_WINDUP, windup * (b.enraged ? 0.92 : 1));
      b.recDur = recover * (b.enraged ? 0.85 : 1);
      b.hitDone = false; b.lastAtk = name;
      if (AT.events) AT.events.emit('telegraph', { kind: name, x: b.x, y: b.y });
    },
    _finish(b, c) {
      b.state = 'recover'; b.stateT = 0; b.telegraph = null; b.telegraphs = [];
      b.cd = c.cd * (b.enraged ? 0.7 : 1);
    },
    _setTele(b, t) { b.telegraph = t; b.telegraphs = t ? (t.circles ? t.circles.map(ci => Object.assign({ shape: 'circle', t: t.t, dur: t.dur }, ci)) : [t]) : []; },

    _mitachurl(b, dt, c, player, alive, d, toP) {
      const rng = b.rng;
      switch (b.state) {
        case 'chase': {
          if (!alive) { b.facing = b.facing; break; }
          b.facing = toP;
          const stop = c.melee.range * 0.7;
          if (d > stop) { b.vx = Math.cos(toP) * b.speed; b.vy = Math.sin(toP) * b.speed; }
          if (b.cd <= 0) {
            const chargeLen = c.charge.speed * c.charge.dur;
            if (d <= c.melee.range + 15) {
              if (rng() < 0.6) this._go(b, 'melee', c.melee.windup, c.melee.recover);
              else this._go(b, 'slam', c.slam.windup, c.slam.recover);
            } else if (d <= c.slam.radius + 50 && rng() < 0.4) this._go(b, 'slam', c.slam.windup, c.slam.recover);
            else if (d > 170 && d <= chargeLen + 40) this._go(b, 'charge', c.charge.windup, c.charge.recover);
            else if (d > chargeLen + 40) b.cd = 0.2; // too far, keep walking
          }
          if (b.state === 'windup') b.dashDir = b.facing;
          break;
        }
        case 'windup': {
          const dur = b.atkDur, t = Math.min(b.stateT, dur);
          if (alive && b.stateT < dur * 0.55) { b.facing = toP; }
          if (b.atk === 'melee') {
            this._setTele(b, { shape: 'cone', x: b.x, y: b.y, r: c.melee.range, angle: b.facing, arc: c.melee.arc, t, dur });
          } else if (b.atk === 'charge') {
            b.dashDir = b.facing;
            this._setTele(b, { shape: 'line', x: b.x, y: b.y, angle: b.dashDir, len: c.charge.speed * c.charge.dur, w: c.charge.width, r: 0, t, dur });
          } else {
            this._setTele(b, { shape: 'circle', x: b.x, y: b.y, r: c.slam.radius, angle: 0, t, dur });
          }
          if (b.stateT >= dur) { b.state = 'attack'; b.stateT = 0; b.telegraph = null; b.telegraphs = []; }
          break;
        }
        case 'attack': {
          if (b.atk === 'melee') {
            if (!b.hitDone) {
              b.hitDone = true;
              if (alive && inCone(player, b.x, b.y, b.facing, c.melee.arc, c.melee.range)) hurt(player, c.melee.dmg, b);
            }
            if (b.stateT >= 0.2) this._finish(b, c);
          } else if (b.atk === 'charge') {
            b.vx = Math.cos(b.dashDir) * c.charge.speed; b.vy = Math.sin(b.dashDir) * c.charge.speed;
            if (alive && !b.hitDone && d < b.r + player.r + c.charge.width * 0.25) {
              b.hitDone = true; hurt(player, c.charge.dmg, b);
            }
            if (b.stateT >= c.charge.dur) this._finish(b, c);
          } else {
            if (!b.hitDone) {
              b.hitDone = true;
              if (alive && d < c.slam.radius) hurt(player, c.slam.dmg, b);
              if (AT.events) AT.events.emit('hit', { x: b.x, y: b.y, element: 'geo', reaction: null, heavy: true });
            }
            if (b.stateT >= 0.25) this._finish(b, c);
          }
          break;
        }
        case 'recover': {
          b.attackName = '';
          if (b.stateT >= (b.recDur || 0.8)) { b.state = 'chase'; b.stateT = 0; b.atk = null; }
          break;
        }
        default: b.state = 'chase'; b.stateT = 0;
      }
    },

    _drake(b, dt, c, player, alive, d, toP) {
      const rng = b.rng;
      switch (b.state) {
        case 'chase': {
          if (!alive) break;
          b.facing = toP;
          // hover: hold a mid distance and slowly orbit
          b.strafeT -= dt;
          if (b.strafeT <= 0) { b.strafeT = 1.5 + rng() * 2; b.strafe = rng() < 0.5 ? -1 : 1; }
          if (d > 300) { b.vx = Math.cos(toP) * b.speed; b.vy = Math.sin(toP) * b.speed; }
          else if (d < 170) { b.vx = -Math.cos(toP) * b.speed * 0.8; b.vy = -Math.sin(toP) * b.speed * 0.8; }
          else { b.vx = Math.cos(toP + Math.PI / 2 * b.strafe) * b.speed * 0.5; b.vy = Math.sin(toP + Math.PI / 2 * b.strafe) * b.speed * 0.5; }
          if (b.cd <= 0 && d < c.aggro * 1.3) {
            const opts = ['volley', 'aoe'];
            if (d < c.sweep.range + 60) opts.push('sweep', 'sweep');
            const pool = opts.filter(o => o !== b.lastAtk);
            const pick = pool[Math.floor(rng() * pool.length)];
            if (pick === 'volley') this._go(b, 'Storm Volley', c.projectile.windup, c.projectile.recover);
            else if (pick === 'sweep') this._go(b, 'Sweeping Storm', c.sweep.windup, c.sweep.recover);
            else this._go(b, 'Thunder Rain', c.aoe.windup, c.aoe.recover);
            b.atk = pick; b.lastAtk = pick;
            if (pick === 'aoe') {
              // lock circle centres now (around the player's current position); player can walk out
              const n = c.aoe.count + (b.enraged ? 1 : 0), circles = [];
              const W = ctx_world(b);
              for (let i = 0; i < n; i++) {
                const a = rng() * TAU, off = i === 0 ? 0 : 70 + rng() * 110;
                let x = player.x + Math.cos(a) * off, y = player.y + Math.sin(a) * off;
                if (W) { x = Math.max(60, Math.min(W.w - 60, x)); y = Math.max(60, Math.min(W.h - 60, y)); }
                circles.push({ x, y, r: c.aoe.radius });
              }
              b.circles = circles;
            }
            b.dashDir = b.facing; b.sweepStart = 0;
          }
          break;
        }
        case 'windup': {
          const dur = b.atkDur, t = Math.min(b.stateT, dur);
          if (alive && b.stateT < dur * 0.6 && b.atk !== 'aoe') { b.facing = toP; }
          if (b.atk === 'volley') {
            const spread = c.projectile.spread * (b.enraged ? 1.2 : 1);
            this._setTele(b, { shape: 'cone', x: b.x, y: b.y, r: 380, angle: b.facing, arc: spread, t, dur });
          } else if (b.atk === 'sweep') {
            // preview the entire swept sector
            this._setTele(b, { shape: 'cone', x: b.x, y: b.y, r: c.sweep.range, angle: b.facing, arc: c.sweep.arc + 0.5, t, dur });
          } else {
            this._setTele(b, { shape: 'circle', x: b.circles[0].x, y: b.circles[0].y, r: c.aoe.radius, angle: 0, t, dur, circles: b.circles });
          }
          if (b.stateT >= dur) {
            b.state = 'attack'; b.stateT = 0; b.telegraph = null; b.telegraphs = [];
            b.dashDir = b.facing; // locked aim
            if (b.atk === 'volley') this._fire(b, c);
          }
          break;
        }
        case 'attack': {
          if (b.atk === 'volley') {
            if (b.stateT >= 0.15) this._finish(b, c);
          } else if (b.atk === 'sweep') {
            const total = c.sweep.sweepTime * (b.enraged ? 0.85 : 1), p = Math.min(1, b.stateT / total);
            const beam = 0.5, ang = b.dashDir - c.sweep.arc / 2 + c.sweep.arc * p;
            b.facing = ang;
            this._setTele(b, { shape: 'cone', x: b.x, y: b.y, r: c.sweep.range, angle: ang, arc: beam, t: b.stateT, dur: total });
            if (alive && !b.hitDone && inCone(player, b.x, b.y, ang, beam, c.sweep.range)) { b.hitDone = true; hurt(player, c.sweep.dmg, b); }
            if (p >= 1) this._finish(b, c);
          } else {
            if (!b.hitDone) {
              b.hitDone = true;
              if (alive) for (const ci of b.circles) {
                if (Math.hypot(player.x - ci.x, player.y - ci.y) < ci.r) { hurt(player, c.aoe.dmg, b); break; }
              }
              if (AT.events) for (const ci of b.circles) AT.events.emit('hit', { x: ci.x, y: ci.y, element: 'electro', reaction: null, heavy: true });
            }
            if (b.stateT >= 0.3) this._finish(b, c);
          }
          break;
        }
        case 'recover': {
          b.attackName = '';
          if (b.stateT >= (b.recDur || 0.8)) { b.state = 'chase'; b.stateT = 0; b.atk = null; }
          break;
        }
        default: b.state = 'chase'; b.stateT = 0;
      }
    },

    _fire(b, c) {
      const p = c.projectile;
      const n = p.count + (b.enraged ? 2 : 0);
      const spread = p.spread * (b.enraged ? 1.2 : 1);
      const hitBase = AT.nextId();
      for (let i = 0; i < n; i++) {
        const a = b.dashDir + (n === 1 ? 0 : (i / (n - 1) - 0.5) * spread);
        if (AT.Projectiles && AT.Projectiles.spawn) {
          AT.Projectiles.spawn({
            owner: 'enemy', element: 'electro',
            x: b.x + Math.cos(a) * (b.r + 6), y: b.y + Math.sin(a) * (b.r + 6),
            vx: Math.cos(a) * p.speed, vy: Math.sin(a) * p.speed, r: p.r, dmg: p.dmg, life: p.life,
            pierce: false, hitIds: {}, dead: false, hitId: hitBase + i / 100, color: '#b58cff'
          });
        }
      }
    }
  };

  // Boss gets its world via ctx; stash it for helpers that need bounds.
  let _ctxWorld = null;
  function ctx_world() { return _ctxWorld; }
  const origUpdate = Bosses.update;
  Bosses.update = function (b, dt, ctx) { _ctxWorld = ctx && ctx.world || null; return origUpdate.call(Bosses, b, dt, ctx); };

  AT.Bosses = Bosses;
})();

/* ==== levels.js ==== */
// Aether's Trial — level definitions, loading and per-frame level update. Pure logic, no DOM.
// Decor entry shape: {visual, x, y, w?, h?, r?, color?, solid:false}. Visuals used:
//  fields: 'stream' (rect, flowing water), 'flower', 'grass', 'clearing' (circle, boss arena)
//  ruins : 'platform' (rect stone), 'glow' (circle glowing rune), 'crack' (rect)
(function () {
  const AT = globalThis.AT;
  const TAU = Math.PI * 2;

  function scatter(rng, n, minGap, w, h, margin, avoid, make) {
    const out = [];
    let tries = 0;
    while (out.length < n && tries++ < n * 60) {
      const x = margin + rng() * (w - 2 * margin), y = margin + rng() * (h - 2 * margin);
      if (avoid(x, y)) continue;
      let ok = true;
      for (const o of out) { if (Math.hypot(o.x - x, o.y - y) < minGap) { ok = false; break; } }
      if (!ok) continue;
      out.push(make(x, y));
    }
    return out;
  }

  function buildFields() {
    const W = 2000, H = 1500, rng = AT.rng(1337);
    const start = { x: 220, y: 1280 }, boss = { x: 1640, y: 340 };
    const chests = [{ x: 520, y: 360 }, { x: 1010, y: 1190 }, { x: 1720, y: 980 }];
    const pond = { x: 1180, y: 830, r: 105 };
    const obstacles = [], decor = [], water = [];

    // Flowing stream (shallow, walkable) across the map; every point is a ford
    for (let i = 0; i < 21; i++) {
      const x = i * 100 + 50, y = 640 + Math.sin(i * 0.55) * 110 + i * 6;
      const seg = { type: 'rect', visual: 'water', x: x - 60, y: y - 34, w: 120, h: 68, solid: false };
      decor.push(Object.assign({}, seg, { visual: 'stream', flow: i }));
      water.push({ x: seg.x, y: seg.y, w: seg.w, h: seg.h });
    }
    // Blocking pond
    obstacles.push({ type: 'circle', x: pond.x, y: pond.y, r: pond.r, visual: 'water', solid: true });
    water.push({ x: pond.x - pond.r, y: pond.y - pond.r, w: pond.r * 2, h: pond.r * 2 });
    decor.push({ visual: 'clearing', x: boss.x, y: boss.y, r: 250, solid: false });

    // Trees ring the boss clearing, with an opening to the south-west
    for (let a = 0; a < TAU; a += 0.27) {
      if (a > 1.35 && a < 2.9) continue;
      const x = boss.x + Math.cos(a) * 330, y = boss.y + Math.sin(a) * 330;
      if (x < 40 || y < 40 || x > W - 40 || y > H - 40) continue;
      obstacles.push({ type: 'circle', x, y, r: 24, visual: 'tree', solid: true });
    }
    const near = (x, y, p, d) => Math.hypot(x - p.x, y - p.y) < d;
    const avoid = (x, y) => near(x, y, start, 220) || near(x, y, boss, 300) || near(x, y, pond, pond.r + 60) ||
      chests.some(c => near(x, y, c, 75));
    const trees = scatter(rng, 42, 85, W, H, 50, avoid, (x, y) => ({ type: 'circle', x, y, r: 20 + rng() * 8, visual: 'tree', solid: true }));
    const rocks = scatter(rng, 14, 90, W, H, 50, (x, y) => avoid(x, y) || trees.some(t => Math.hypot(t.x - x, t.y - y) < 60),
      (x, y) => ({ type: 'circle', x, y, r: 15 + rng() * 11, visual: 'rock', solid: true }));
    obstacles.push(...trees, ...rocks);
    const colors = ['#ffffff', '#ffe27a', '#ff9ec7', '#9fd8ff'];
    for (let i = 0; i < 160; i++) {
      const x = rng() * W, y = rng() * H;
      decor.push({ visual: i % 3 ? 'flower' : 'grass', x, y, r: 3 + rng() * 2, color: colors[Math.floor(rng() * colors.length)], solid: false });
    }
    return { index: 0, name: AT.CFG.LEVELS[0].name, w: W, h: H, theme: 'fields', obstacles, decor, water,
      playerStart: start, spawnPoints: { player: start, boss, chests } };
  }

  function buildRuins() {
    const W = 2200, H = 1600, rng = AT.rng(4242);
    const start = { x: 250, y: 1380 }, boss = { x: 1700, y: 420 };
    const chests = [{ x: 820, y: 430 }, { x: 1560, y: 1250 }];
    const obstacles = [], decor = [], water = [];
    const E = 44; // void edge thickness
    obstacles.push({ type: 'rect', x: 0, y: 0, w: W, h: E, visual: 'void', solid: true },
      { type: 'rect', x: 0, y: H - E, w: W, h: E, visual: 'void', solid: true },
      { type: 'rect', x: 0, y: 0, w: E, h: H, visual: 'void', solid: true },
      { type: 'rect', x: W - E, y: 0, w: E, h: H, visual: 'void', solid: true });
    // central chasm with a bridge-gap in the middle
    const chasms = [{ x: 1060, y: E, w: 90, h: 540 }, { x: 1060, y: 980, w: 90, h: H - E - 980 },
      { x: 380, y: 760, w: 340, h: 90 }, { x: 1500, y: 700, w: 300, h: 80 }];
    for (const c of chasms) obstacles.push({ type: 'rect', x: c.x, y: c.y, w: c.w, h: c.h, visual: 'void', solid: true });
    // stone platforms (walkable decor)
    const plats = [[110, 1180, 400, 300], [640, 200, 420, 300], [1250, 900, 520, 360], [1480, 190, 500, 480], [330, 480, 300, 240], [1650, 1220, 400, 280]];
    for (const p of plats) decor.push({ visual: 'platform', x: p[0], y: p[1], w: p[2], h: p[3], solid: false });
    // boss arena pillars (broken ring, opening to the south-west)
    for (let a = 0; a < TAU; a += 0.5) {
      if (a > 1.4 && a < 3.0) continue;
      const x = boss.x + Math.cos(a) * 300, y = boss.y + Math.sin(a) * 300;
      if (x < 90 || y < 90 || x > W - 90 || y > H - 90) continue;
      obstacles.push({ type: 'circle', x, y, r: 24, visual: 'pillar', solid: true });
    }
    const near = (x, y, p, d) => Math.hypot(x - p.x, y - p.y) < d;
    const inVoid = (x, y, m) => chasms.some(c => x > c.x - m && x < c.x + c.w + m && y > c.y - m && y < c.y + c.h + m);
    const avoid = (x, y) => near(x, y, start, 230) || near(x, y, boss, 250) || chests.some(c => near(x, y, c, 80)) || inVoid(x, y, 60);
    const pillars = scatter(rng, 26, 110, W, H, 90, avoid, (x, y) => ({ type: 'circle', x, y, r: 18 + rng() * 10, visual: 'pillar', solid: true }));
    const walls = scatter(rng, 9, 200, W, H, 120, (x, y) => avoid(x, y) || pillars.some(p => Math.hypot(p.x - x, p.y - y) < 80),
      (x, y) => (rng() < 0.5 ? { type: 'rect', x: x - 55, y: y - 14, w: 110, h: 28, visual: 'wall', solid: true }
        : { type: 'rect', x: x - 14, y: y - 55, w: 28, h: 110, visual: 'wall', solid: true }));
    obstacles.push(...pillars, ...walls);
    for (let i = 0; i < 34; i++) {
      const x = 80 + rng() * (W - 160), y = 80 + rng() * (H - 160);
      if (inVoid(x, y, 10)) continue;
      decor.push({ visual: 'glow', x, y, r: 8 + rng() * 10, color: rng() < 0.5 ? '#8fd6ff' : '#c9a0ff', solid: false });
    }
    for (let i = 0; i < 18; i++) decor.push({ visual: 'crack', x: 80 + rng() * (W - 160), y: 80 + rng() * (H - 160), w: 40 + rng() * 60, h: 6, solid: false });
    return { index: 1, name: AT.CFG.LEVELS[1].name, w: W, h: H, theme: 'ruins', obstacles, decor, water,
      playerStart: start, spawnPoints: { player: start, boss, chests } };
  }

  const defs = [
    { index: 0, name: 'Mondstadt Fields', w: 2000, h: 1500, theme: 'fields', bossId: 'mitachurl', build: buildFields },
    { index: 1, name: 'Stormterror Ruins', w: 2200, h: 1600, theme: 'ruins', bossId: 'stormdrake', build: buildRuins }
  ];

  const ELEMENTS = ['hydro', 'pyro', 'electro', 'anemo', 'cryo', 'geo'];

  function plan(index, rng) {
    if (index === 0) { // 10 slimes, >=3 hydro, at least one of each other variant
      const list = ['hydro', 'hydro', 'hydro', 'pyro', 'electro', 'anemo', 'cryo', 'geo'];
      while (list.length < 10) list.push(ELEMENTS[Math.floor(rng() * ELEMENTS.length)]);
      return list.map(el => ({ el, behavior: 'normal' }));
    }
    const out = [];
    const shooters = ['electro', 'anemo', 'electro'];
    for (const el of shooters) out.push({ el, behavior: 'shooter' });
    const fixed = ['hydro', 'hydro', 'pyro', 'cryo'];
    for (let i = 0; i < 12; i++) {
      const el = i < fixed.length ? fixed[i] : ELEMENTS[Math.floor(rng() * ELEMENTS.length)];
      out.push({ el, behavior: i % 3 === 0 ? 'lunger' : 'normal' });
    }
    return out;
  }

  const Levels = {
    defs,

    load(index, rng) {
      index = index === 1 ? 1 : 0;
      rng = rng || AT.rng(1000 + index * 77);
      const def = defs[index];
      const worldDef = def.build();
      const world = AT.World.create(worldDef);
      const L = AT.CFG.LEVELS[index];
      const sp = worldDef.spawnPoints;

      // player start must be open
      const ps = world.findOpenNear(sp.player.x, sp.player.y, 20);
      world.playerStart.x = ps.x; world.playerStart.y = ps.y;

      const bossPos = world.findOpenNear(sp.boss.x, sp.boss.y, AT.CFG.BOSS[def.bossId].r + 6);
      const boss = AT.Bosses.create(def.bossId, bossPos.x, bossPos.y);

      const chestDefs = (AT.CFG.LOOT.chests && AT.CFG.LOOT.chests[index]) || [];
      const chests = sp.chests.map((p, i) => {
        const q = world.findOpenNear(p.x, p.y, 26);
        const rw = chestDefs[i] || { coins: 0, gems: 0, potions: 0 };
        return { kind: 'chest', id: AT.nextId(), x: q.x, y: q.y, r: 22, opened: false,
          rewards: { coins: rw.coins, gems: rw.gems, potions: rw.potions } };
      });

      const enemies = [];
      const slots = plan(index, rng);
      const er = AT.CFG.ENEMY.slime.r + 6;
      for (const s of slots) {
        let pt = null;
        for (let t = 0; t < 400 && !pt; t++) {
          const c = world.randomOpenPoint(rng, er);
          const strict = t < 300;
          if (Math.hypot(c.x - world.playerStart.x, c.y - world.playerStart.y) < (strict ? 420 : 300)) continue;
          if (Math.hypot(c.x - bossPos.x, c.y - bossPos.y) < (strict ? 300 : 220)) continue;
          if (strict && enemies.some(o => Math.hypot(o.x - c.x, o.y - c.y) < 90)) continue;
          if (chests.some(ch => Math.hypot(ch.x - c.x, ch.y - c.y) < 50)) continue;
          pt = c;
        }
        if (!pt) pt = world.findOpenNear(world.w * 0.5, world.h * 0.5, er);
        const e = AT.Enemies.create('slime', s.el, pt.x, pt.y, index, { behavior: s.behavior, rng: AT.rng(Math.floor(rng() * 1e9) + 1) });
        enemies.push(e);
      }

      return {
        index, name: L.name, world, enemies, boss, chests, pickups: [],
        objective: L.objective, completed: false, enemiesTotal: enemies.length,
        enemiesKilled: 0, bossDefeated: false, time: 0, rng
      };
    },

    update(dt, level, player) {
      if (!level || !player) return;
      if (player.dead || player.hp <= 0) return; // nothing runs while the player is dead
      level.time += dt;
      const world = level.world;
      const ctx = { player, world, level, rng: level.rng };

      for (const e of level.enemies) {
        AT.Enemies.update(e, dt, ctx);
        if (!e.dead) { world.resolveEntity(e); world.clampEntity(e); }
      }
      const boss = level.boss;
      if (boss) {
        AT.Bosses.update(boss, dt, ctx);
        if (!boss.dead) { world.resolveEntity(boss); world.clampEntity(boss); }
      }

      // soft separation (enemies push each other apart; boss is heavy and only pushes slimes)
      const live = level.enemies.filter(e => !e.dead);
      for (let i = 0; i < live.length; i++) {
        const a = live[i];
        for (let j = i + 1; j < live.length; j++) {
          const b = live[j];
          const dx = b.x - a.x, dy = b.y - a.y, m = a.r + b.r;
          const d2 = dx * dx + dy * dy;
          if (d2 >= m * m) continue;
          const d = Math.sqrt(d2) || 0.001, push = (m - d) * Math.min(1, 6 * dt) * 0.5;
          const nx = dx / d, ny = dy / d;
          a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
        }
        if (boss && !boss.dead) {
          const dx = a.x - boss.x, dy = a.y - boss.y, m = a.r + boss.r, d2 = dx * dx + dy * dy;
          if (d2 < m * m) { const d = Math.sqrt(d2) || 0.001, push = (m - d) * Math.min(1, 8 * dt); a.x += dx / d * push; a.y += dy / d * push; }
        }
        world.resolveEntity(a); world.clampEntity(a);
      }

      // count deaths exactly once, then drop corpses after the death animation
      const deathDur = (AT.CFG.ENEMY && AT.CFG.ENEMY.deathDur) || 0.8;
      for (const e of level.enemies) {
        if (e.dead && !e._counted) { e._counted = true; level.enemiesKilled++; }
      }
      if (level.enemies.some(e => e.dead && e.deathT >= deathDur)) {
        level.enemies = level.enemies.filter(e => !(e.dead && e.deathT >= deathDur));
      }
      if (boss && boss.dead) level.bossDefeated = true;

      if (!level.completed && level.enemiesKilled >= level.enemiesTotal && boss && boss.dead) {
        level.completed = true;
        AT.events.emit('levelComplete', { levelIndex: level.index });
      }
    }
  };

  AT.Levels = Levels;
})();

/* ==== progression.js ==== */
// Aether's Trial — progression (XP, levels, persistent rewards, retry snapshot). Pure logic, Node-safe.
(function () {
  const AT = globalThis.AT;
  const CFG = () => AT.CFG;

  const P = {
    state: null,
    entrySnap: null,
    levelIndex: 0,
    rewarded: {},          // enemy id -> true (one grant per enemy id, per level attempt)
    stats: { kills: 0, xp: 0, bossKills: 0 }, // per level attempt
    _rng: null,
    _handlers: null,
    _getLevel: null
  };

  function baseState() {
    const pc = CFG().PLAYER;
    return {
      level: 1, xp: 0, coins: 0, gems: 0,
      potions: (CFG().LOOT.startPotions != null ? CFG().LOOT.startPotions : 1),
      maxHp: pc.baseHp, atk: pc.baseAtk
    };
  }

  function seedRng(levelIndex) { P._rng = AT.rng(9001 + (levelIndex | 0) * 7717); }

  P.reset = function () {
    P.state = baseState();
    P.entrySnap = P.snapshot();
    P.levelIndex = 0;
    P.rewarded = {};
    P.stats = { kills: 0, xp: 0, bossKills: 0 };
    seedRng(0);
    P.syncPlayer(AT.player);
    return P.state;
  };

  P.xpToNext = function (level) {
    const x = CFG().XP;
    if (level >= x.maxLevel) return Infinity;
    return Math.round(x.base + x.growth * Math.pow(Math.max(0, level - 1), x.exponent));
  };

  // Mirror persistent counters onto a player object (does not touch hp).
  P.syncPlayer = function (p) {
    if (!p || !P.state) return;
    const s = P.state;
    p.level = s.level; p.xp = s.xp; p.coins = s.coins; p.gems = s.gems; p.potions = s.potions;
    p.maxHp = s.maxHp; p.atk = s.atk;
    if (typeof p.hp !== 'number') p.hp = s.maxHp;
    if (p.hp > p.maxHp) p.hp = p.maxHp;
  };

  P.applyToPlayer = function (p) { P.syncPlayer(p); return p; };

  P.addXp = function (n, player) {
    const s = P.state, pc = CFG().PLAYER;
    n = Math.floor(Number(n) || 0);
    if (n <= 0) return 0;
    const p = player || AT.player;
    if (s.level >= CFG().XP.maxLevel) { s.xp = 0; return 0; }
    s.xp += n;
    P.stats.xp += n;
    let ups = 0;
    while (s.level < CFG().XP.maxLevel && s.xp >= P.xpToNext(s.level)) {
      s.xp -= P.xpToNext(s.level);
      s.level++; ups++;
      s.maxHp += pc.hpPerLevel;
      s.atk += pc.atkPerLevel;
      if (p && !p.dead) {
        p.maxHp = s.maxHp; p.atk = s.atk;
        const base = typeof p.hp === 'number' ? p.hp : 0;
        p.hp = Math.min(s.maxHp, base + s.maxHp * pc.healOnLevelUp);
        AT.events.emit('hpChanged', {});
      }
      AT.events.emit('levelUp', { level: s.level });
    }
    if (s.level >= CFG().XP.maxLevel) s.xp = 0;
    P.syncPlayer(p);
    return ups;
  };

  P.addCoins = function (n) { n = Math.max(0, Math.floor(Number(n) || 0)); P.state.coins += n; P.syncPlayer(AT.player); return n; };
  P.addGems = function (n) { n = Math.max(0, Math.floor(Number(n) || 0)); P.state.gems += n; P.syncPlayer(AT.player); return n; };
  P.addPotions = function (n) {
    n = Math.max(0, Math.floor(Number(n) || 0));
    const max = CFG().LOOT.maxPotions != null ? CFG().LOOT.maxPotions : 9;
    const add = Math.max(0, Math.min(n, max - P.state.potions));
    P.state.potions += add; P.syncPlayer(AT.player);
    return add;
  };

  P.snapshot = function () { return JSON.parse(JSON.stringify(P.state)); };
  P.restore = function (snap) {
    if (!snap) return false;
    P.state = JSON.parse(JSON.stringify(snap));
    P.syncPlayer(AT.player);
    return true;
  };

  P.beginLevel = function (levelIndex) {
    if (!P.state) P.reset();
    P.levelIndex = levelIndex | 0;
    P.entrySnap = P.snapshot();
    P.rewarded = {};
    P.stats = { kills: 0, xp: 0, bossKills: 0 };
    seedRng(P.levelIndex);
  };

  // Restores the state recorded at level entry; kills / drops of the failed attempt are forgotten.
  P.retryLevel = function () {
    if (!P.entrySnap) return false;
    P.restore(P.entrySnap);
    P.rewarded = {};
    P.stats = { kills: 0, xp: 0, bossKills: 0 };
    seedRng(P.levelIndex);
    const p = AT.player;
    if (p) { p.maxHp = P.state.maxHp; p.atk = P.state.atk; p.hp = Math.min(p.hp || 0, p.maxHp); }
    return true;
  };

  // Gains since level entry (for the level complete screen).
  P.levelGains = function () {
    const e = P.entrySnap || P.state, s = P.state;
    return { kills: P.stats.kills, xp: P.stats.xp, coins: s.coins - e.coins, gems: s.gems - e.gems,
             levels: s.level - e.level };
  };

  function currentLevel() {
    if (typeof P._getLevel === 'function') return P._getLevel() || null;
    return (AT.Game && AT.Game.level) || null;
  }

  function grant(e, isBoss) {
    if (!e || e.rewardGiven) return false;
    const key = e.id != null ? e.id : null;
    if (key != null && P.rewarded[key]) { e.rewardGiven = true; return false; }
    if (key != null) P.rewarded[key] = true;
    e.rewardGiven = true;
    if (!P.state) P.reset();
    const cfg = isBoss ? (CFG().BOSS[e.id] || {}) : (CFG().ENEMY[e.type] || {});
    const xp = (e.xp != null ? e.xp : (cfg.xp || 0)) * (CFG().XP.perKillMul || 1);
    P.stats.kills++;
    if (isBoss) P.stats.bossKills++;
    P.addXp(xp);
    const level = currentLevel();
    const drops = AT.Loot && AT.Loot.spawnDrops ? AT.Loot.spawnDrops(e, level, P._rng) : [];
    if (!level) { // no world to drop into: grant directly
      for (const d of drops) {
        if (d.type === 'coin') P.addCoins(d.amount);
        else if (d.type === 'gem') P.addGems(d.amount);
        else if (d.type === 'potion') P.addPotions(d.amount);
      }
    }
    return true;
  }

  P.grantKill = function (enemy) { return grant(enemy, enemy && enemy.kind === 'boss'); };
  P.grantBoss = function (boss) { return grant(boss, true); };

  P.unbind = function () {
    if (!P._handlers) return;
    AT.events.off('enemyKilled', P._handlers.kill);
    AT.events.off('bossDefeated', P._handlers.boss);
    P._handlers = null;
  };

  // getLevel: optional function returning the active level (defaults to AT.Game.level).
  P.bind = function (getLevel) {
    P.unbind();
    if (typeof getLevel === 'function') P._getLevel = getLevel;
    if (!P.state) P.reset();
    P._handlers = {
      kill: function (ev) { if (ev && ev.enemy) P.grantKill(ev.enemy); },
      boss: function (ev) { if (ev && ev.boss) P.grantBoss(ev.boss); }
    };
    AT.events.on('enemyKilled', P._handlers.kill);
    AT.events.on('bossDefeated', P._handlers.boss);
  };

  AT.Progression = P;
  P.reset();
})();

/* ==== inventory.js ==== */
// Aether's Trial — inventory actions (potions, chests). Pure logic, Node-safe.
(function () {
  const AT = globalThis.AT;
  const I = {};

  I.interactRange = function () {
    const l = AT.CFG.LOOT;
    return (l && l.interactRange) || 64;
  };

  I.usePotion = function (player) {
    const P = AT.Progression;
    if (!player || player.dead || !P || !P.state) return false;
    const maxHp = player.maxHp || P.state.maxHp;
    if (P.state.potions <= 0) return false;
    if (!(player.hp < maxHp)) return false;
    const heal = Math.min(AT.CFG.LOOT.potionHeal, maxHp - player.hp);
    player.hp = Math.min(maxHp, player.hp + AT.CFG.LOOT.potionHeal);
    P.state.potions--;
    P.syncPlayer(player);
    AT.events.emit('hpChanged', {});
    AT.events.emit('potionUsed', { healed: heal });
    return true;
  };

  function fallbackRewards(chest, level) {
    const table = AT.CFG.LOOT.chests;
    const li = level && level.index != null ? level.index : (AT.Progression ? AT.Progression.levelIndex : 0);
    const list = table[li] || [];
    let ci = level && level.chests ? level.chests.indexOf(chest) : -1;
    if (ci < 0) ci = 0;
    return list[ci] || list[0] || { coins: 0, gems: 0, potions: 0 };
  }

  // Returns the rewards actually granted, or null if already opened.
  I.openChest = function (chest, player, level) {
    if (!chest || chest.opened) return null;
    chest.opened = true;
    const P = AT.Progression;
    const r = chest.rewards || fallbackRewards(chest, level || (AT.Game && AT.Game.level));
    const granted = {
      coins: P.addCoins(r.coins || 0),
      gems: P.addGems(r.gems || 0),
      potions: P.addPotions(r.potions || 0)
    };
    P.syncPlayer(player || AT.player);
    AT.events.emit('chestOpened', { chest: chest, x: chest.x, y: chest.y, rewards: granted });
    return granted;
  };

  I.nearestChest = function (player, chests, range) {
    if (!player || !chests) return null;
    range = range != null ? range : I.interactRange();
    let best = null, bd = Infinity;
    for (const c of chests) {
      if (!c || c.opened) continue;
      const d = Math.hypot(c.x - player.x, c.y - player.y);
      if (d <= range && d < bd) { bd = d; best = c; }
    }
    return best;
  };

  AT.Inventory = I;
})();

/* ==== loot.js ==== */
// Aether's Trial — loot drops, pickups, chest interaction. Pure logic, Node-safe.
(function () {
  const AT = globalThis.AT;
  const L = {};
  const cfg = () => AT.CFG.LOOT;

  function award(p) {
    const P = AT.Progression;
    if (p.type === 'coin') return P.addCoins(p.amount);
    if (p.type === 'gem') return P.addGems(p.amount);
    if (p.type === 'potion') return P.addPotions(p.amount);
    return 0;
  }

  function makePickup(type, amount, x, y, rng) {
    const a = rng ? rng() * Math.PI * 2 : 0;
    const sp = rng ? 50 + rng() * 90 : 0;
    return { kind: 'pickup', id: AT.nextId(), type: type, x: x, y: y, amount: amount,
             life: cfg().pickupLife, age: 0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, collected: false };
  }

  function addToLevel(level, p) {
    if (!level.pickups) level.pickups = [];
    const cap = AT.CFG.LIMITS.pickups;
    while (level.pickups.length >= cap) { // over cap: oldest pickup is paid out immediately
      const old = level.pickups.shift();
      if (old && !old.collected) { old.collected = true; award(old); }
    }
    level.pickups.push(p);
  }

  // Builds drops for a killed enemy/boss. Pushes them into level.pickups when a level is given.
  L.spawnDrops = function (enemy, level, rng) {
    const out = [];
    if (!enemy) return out;
    rng = rng || Math.random;
    const c = cfg();
    const isBoss = enemy.kind === 'boss';
    const bc = isBoss ? (AT.CFG.BOSS[enemy.id] || {}) : {};
    let coins = enemy.coins;
    if (!(coins > 0)) coins = isBoss ? (bc.coins || 0) : Math.round(c.coinPerKill[0] + rng() * (c.coinPerKill[1] - c.coinPerKill[0]));
    if (coins > 0) out.push(makePickup('coin', coins, enemy.x, enemy.y, rng));
    if (isBoss) {
      const n = c.bossPotionDrops || 0;
      for (let i = 0; i < n; i++) out.push(makePickup('potion', 1, enemy.x, enemy.y, rng));
    } else if (rng() < c.potionDropChance) {
      out.push(makePickup('potion', 1, enemy.x, enemy.y, rng));
    }
    if (level) for (const p of out) addToLevel(level, p);
    return out;
  };

  function fPressed() {
    const I = AT.Input;
    if (!I || typeof I.pressed !== 'function') return false;
    try { return !!(I.pressed('KeyF') || I.pressed('f') || I.pressed('F')); } catch (e) { return false; }
  }

  // F pressed near a chest opens it. Safe to call repeatedly: a chest opens once.
  L.interact = function (player, level) {
    if (!player || player.dead || !level || !level.chests) return null;
    const chest = AT.Inventory.nearestChest(player, level.chests, AT.Inventory.interactRange());
    if (!chest) return null;
    return AT.Inventory.openChest(chest, player, level) ? chest : null;
  };

  L.update = function (dt, level, player) {
    if (!level) return;
    if (player && !player.dead && fPressed()) L.interact(player, level);
    const list = level.pickups;
    if (!list || !list.length) return;
    const c = cfg();
    const alive = !!(player && !player.dead);
    const pr = (player && player.r) || AT.CFG.PLAYER.radius;
    const P = AT.Progression;
    for (const p of list) {
      if (p.collected) continue;
      p.age = (p.age || 0) + dt;
      p.life -= dt;
      if (p.vx || p.vy) {
        p.x += p.vx * dt; p.y += p.vy * dt;
        const f = Math.exp(-5 * dt); p.vx *= f; p.vy *= f;
        if (Math.abs(p.vx) + Math.abs(p.vy) < 2) { p.vx = 0; p.vy = 0; }
      }
      if (!alive) continue;
      if (p.type === 'potion' && P.state.potions >= (c.maxPotions != null ? c.maxPotions : 9)) continue;
      const dx = player.x - p.x, dy = player.y - p.y;
      const d = Math.hypot(dx, dy);
      if (d <= c.pickupRange + pr) {
        const amt = award(p);
        p.collected = true;
        if (amt > 0) AT.events.emit('pickup', { kind: p.type, amount: amt, x: p.x, y: p.y });
      } else if (d <= c.magnetRange && p.age > 0.25) {
        const spd = 220 + (1 - d / c.magnetRange) * 360;
        const step = Math.min(d, spd * dt);
        p.x += dx / d * step; p.y += dy / d * step;
        p.vx = 0; p.vy = 0;
      }
    }
    for (let i = list.length - 1; i >= 0; i--) if (list[i].collected || list[i].life <= 0) list.splice(i, 1);
  };

  AT.Loot = L;
})();

/* ==== minimap.js ==== */
// Aether's Trial — minimap. collectBlips is pure; draw only uses the passed ctx.
(function () {
  const AT = globalThis.AT;
  const M = {};

  function worldSize(game) {
    const w = game && game.level && game.level.world;
    if (!w) return { x: 0, y: 0, w: 1, h: 1 };
    const b = w.bounds;
    if (b && b.w > 0 && b.h > 0) return { x: b.x || 0, y: b.y || 0, w: b.w, h: b.h };
    return { x: 0, y: 0, w: w.w || (b && b.width) || 1, h: w.h || (b && b.height) || 1 };
  }

  M.collectBlips = function (game) {
    const out = [];
    if (!game) return out;
    const p = game.player;
    if (p) out.push({ type: 'player', x: p.x, y: p.y, facing: p.facing || 0 });
    const lv = game.level;
    if (!lv) return out;
